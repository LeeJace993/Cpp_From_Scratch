<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>心动计划·C++ 学院</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* 心动计划·C++ 学院：深色街机单主题（与像素实验室/码探事务所同族）。
   墨蓝底/金色主色/青色辅助 + 教室专属的墨绿黑板与粉笔白。CRT 扫描线。 */
:root{
  color-scheme:dark;
  --bg:#0b0d1c; --bg2:#10132a; --panel:#171b36; --panel2:#1f2447;
  --line:#39406e; --line2:#565f9e;
  --fg:#e9ecff; --dim:#9aa3d6; --faint:#6a72a8;
  --gold:#ffd23f; --gold-dk:#b98f14;
  --green:#5fe08a; --red:#ff5d73; --cyan:#5ad0ff; --purple:#b48cff;
  --board:#123326; --board-line:#2c5c44; --chalk:#e9f2e4; --chalk-dim:#9dbfa8;
  --shadow:rgba(0,0,0,.5);
  --f-disp:'Press Start 2P',monospace;
  --f-body:'Noto Sans SC',system-ui,sans-serif;
  --f-mono:'JetBrains Mono','Noto Sans SC',monospace;
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--f-body);font-size:15px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:22px 44px;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px),
    radial-gradient(ellipse at center,transparent 62%,rgba(0,0,0,.3) 100%);
}
#wrap{max-width:800px;margin:0 auto}
[hidden]{display:none!important}
h1,h2,h3{line-height:1.4;text-wrap:balance;margin:0 0 10px}
.disp{font-family:var(--f-disp)}
.panel{background:var(--panel);border:3px solid var(--line);box-shadow:5px 5px 0 var(--shadow);padding:16px 18px;margin:0 0 16px}
.panel2{background:var(--panel2)}
.btn{
  font-family:var(--f-disp);font-size:11px;letter-spacing:1px;
  background:var(--gold);color:#15130a;border:3px solid #15130a;
  box-shadow:0 4px 0 var(--gold-dk),4px 4px 0 var(--shadow);
  padding:11px 18px;cursor:pointer;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-dk)}
.btn.ghost{background:var(--panel2);color:var(--fg);border-color:var(--line2);box-shadow:0 4px 0 #22264d,4px 4px 0 var(--shadow)}
.btn.ghost:active{box-shadow:0 1px 0 #22264d}
.btn.small{font-size:9px;padding:8px 12px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.tag{display:inline-block;font-size:11px;font-weight:700;border:2px solid var(--line2);color:var(--dim);background:var(--bg2);padding:1px 8px;margin:0 6px 6px 0}
.tag.gold{color:var(--gold);border-color:var(--gold-dk)}
.tag.cyan{color:var(--cyan);border-color:#2a6a86}
.tag.red{color:var(--red);border-color:#8a3040}
.dim{color:var(--dim)}.faint{color:var(--faint)}.small{font-size:13px}
hr.px{border:none;border-top:3px solid var(--line);margin:14px 0}
/* 状态条 */
#status{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--panel);border:3px solid var(--line);box-shadow:5px 5px 0 var(--shadow);padding:9px 14px;margin:0 0 18px;font-size:13px}
#status .grow{flex:1 1 130px;min-width:110px}
.lv{font-family:var(--f-disp);font-size:10px;color:var(--gold);white-space:nowrap}
.xpbar{height:12px;background:var(--bg2);border:2px solid var(--line2);position:relative;overflow:hidden}
.xpbar i{position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--gold) 0 8px,var(--gold-dk) 8px 12px);transform-origin:left}
#status button{font-family:var(--f-disp);font-size:9px;background:var(--panel2);color:var(--dim);border:2px solid var(--line2);padding:6px 9px;cursor:pointer}
#status button:hover{color:var(--fg)}
/* 标题屏 */
#scr-title{text-align:center;padding-top:26px}
#scr-title .sub{font-family:var(--f-disp);font-size:10px;color:var(--cyan);letter-spacing:2px;margin:12px 0 4px}
#scr-title h1{font-size:46px;font-weight:900;letter-spacing:4px;color:var(--gold);text-shadow:0 6px 0 var(--gold-dk),6px 6px 0 rgba(0,0,0,.5);margin:4px 0}
#scr-title .logo2{font-family:var(--f-disp);font-size:12px;letter-spacing:1px}
.bob{animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(4px)}}
.pixelbox{display:inline-block;padding:14px;border:3px solid var(--line);background:var(--panel);box-shadow:5px 5px 0 var(--shadow);image-rendering:pixelated}
/* 关卡路径 */
.lvl{display:flex;flex-direction:column}
.node{display:flex;gap:14px;align-items:stretch}
.node .rail{display:flex;flex-direction:column;align-items:center;width:34px;flex:none}
.node .dot{width:34px;height:34px;border:3px solid var(--line2);background:var(--panel2);display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-size:10px;color:var(--dim);flex:none}
.node .wire{width:4px;flex:1;background:var(--line);min-height:14px}
.node:last-child .wire{display:none}
.node .card{flex:1;min-width:0;background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:12px 14px;margin:0 0 14px;cursor:pointer}
.node .card:hover{border-color:var(--line2)}
.node.locked .card{opacity:.42;cursor:not-allowed}
.node.done .dot{background:#123a24;border-color:var(--green);color:var(--green)}
.node.done .card{border-color:#2c7c4a}
.node .nm{font-weight:900;font-size:16px}
.node .stars{color:var(--gold);font-size:13px;letter-spacing:2px}
/* ---- 教室 ---- */
.classroom{background:var(--panel);border:3px solid var(--line);box-shadow:5px 5px 0 var(--shadow);padding:14px;margin:0 0 14px}
#board{
  background:var(--board);border:6px solid var(--board-line);box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),5px 5px 0 var(--shadow);
  min-height:190px;padding:16px 18px;position:relative;color:var(--chalk);
  font-family:var(--f-mono);font-size:14px;line-height:1.9;
}
#board .cap{position:absolute;top:-13px;left:14px;font-family:var(--f-disp);font-size:9px;color:var(--gold);background:var(--panel);border:2px solid var(--gold-dk);padding:3px 8px;letter-spacing:1px}
#board pre{margin:0;white-space:pre-wrap;word-break:break-all;font-family:inherit;color:inherit}
#board .k{color:#ffd23f}#board .c{color:#8fd8ff}#board .cm{color:#7f9c8b}#board .err{color:#ff8d9d}
#board.cwriting::before{
  content:"";position:absolute;right:14px;bottom:12px;width:10px;height:16px;
  background:var(--chalk);clip-path:polygon(0 0,100% 30%,70% 100%,0 100%);
  animation:chalkbob .35s steps(2) infinite;
}
@keyframes chalkbob{50%{transform:translate(-3px,-4px) rotate(-6deg)}}
/* 粉笔字逐字浮现 */
.ck{display:inline-block;animation:ckin .06s steps(2) both}
@keyframes ckin{from{opacity:0}to{opacity:1}}
/* 讲台与人物 */
#deskrow{display:flex;align-items:flex-end;gap:14px;margin:14px 4px 2px;min-height:120px}
#teacher{flex:none;image-rendering:pixelated}
#speech{
  flex:1;min-width:0;background:var(--panel2);border:3px solid var(--line2);box-shadow:4px 4px 0 var(--shadow);
  padding:10px 14px;position:relative;font-size:15px;min-height:86px;cursor:pointer;
}
#speech::before{
  content:"";position:absolute;left:-13px;bottom:18px;width:0;height:0;
  border:8px solid transparent;border-right-color:var(--line2);
}
#speech .who{font-family:var(--f-disp);font-size:9px;color:var(--gold);letter-spacing:1px;margin:0 0 6px}
#speech .tx{color:var(--fg)}
#speech .hint{font-size:12px;color:var(--faint);text-align:right;margin-top:6px;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
/* 问答区 */
#quizzone{margin-top:14px}
.qstem{font-size:15px;margin:0 0 8px}
.qnum{font-family:var(--f-disp);font-size:9px;color:var(--cyan);letter-spacing:2px;margin:0 0 8px}
.codebox{overflow-x:auto;background:#0d1024;border:3px solid var(--line);padding:10px 12px;box-shadow:4px 4px 0 var(--shadow);margin:8px 0 10px}
.codebox pre{margin:0;font-family:var(--f-mono);font-size:13px;line-height:1.8}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{
  text-align:left;font-family:var(--f-mono);font-size:13.5px;line-height:1.6;
  background:var(--panel2);color:var(--fg);border:3px solid var(--line2);
  padding:9px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);
  display:flex;gap:10px;align-items:baseline;
}
.opts button .ol{font-family:var(--f-disp);font-size:9px;color:var(--cyan);flex:none}
.opts button:hover:not(:disabled){border-color:var(--gold)}
.opts button:disabled{cursor:default}
.opts button.good{border-color:var(--green);background:#10331f}
.opts button.bad{border-color:var(--red);background:#331318;animation:shake .3s}
.opts button.reveal{border-color:var(--gold);background:#33290c}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* 心血值 */
#hearts{display:flex;gap:5px;font-size:17px;line-height:1}
#hearts span{transition:transform .15s}
#hearts span.gone{filter:grayscale(1);opacity:.3;transform:scale(.8)}
/* 讲评 */
.review{border:3px solid var(--line2);background:var(--bg2);padding:12px 14px;margin:10px 0;font-size:14px}
.review .rl{font-family:var(--f-disp);font-size:9px;letter-spacing:1px;margin:0 0 6px}
.review.ok{border-color:#2c7c4a}.review.ok .rl{color:var(--green)}
.review.ng{border-color:#8a3040}.review.ng .rl{color:var(--red)}
/* 进度条(关卡内) */
.stagebar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.st{flex:1 1 60px;min-width:56px;text-align:center;font-size:12px;border:2px solid var(--line);background:var(--bg2);color:var(--faint);padding:5px 4px}
.st.now{border-color:var(--gold);color:var(--gold);background:var(--panel2)}
.st.ok{border-color:#2c7c4a;color:var(--green)}
.st.boss{font-family:var(--f-disp);font-size:9px;letter-spacing:1px}
/* 结算 */
#scr-done{text-align:center;padding-top:10px}
.stars-big{font-size:38px;letter-spacing:10px;color:var(--gold);text-shadow:0 4px 0 var(--gold-dk)}
.stars-big .off{color:var(--line);text-shadow:none}
.flyxp{font-family:var(--f-disp);font-size:12px;color:var(--gold);margin:10px 0}
@media (max-width:520px){
  #scr-title h1{font-size:32px;letter-spacing:2px}
  #deskrow{flex-direction:column-reverse;align-items:stretch}
  #speech::before{display:none}
}
/* ---- 校园与学院系统 ---- */
.campus{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.bld{background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:14px;cursor:pointer;position:relative}
.bld:hover:not(.locked){border-color:var(--line2)}
.bld .bico{width:36px;height:36px;border:3px solid var(--line2);background:var(--panel2);display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);font-size:12px;color:var(--gold)}
.bld .bnm{font-weight:900;font-size:16px;margin:8px 0 2px}
.bld .bds{font-size:12.5px;color:var(--dim);min-width:0}
.bld.locked{opacity:.42;cursor:not-allowed}
.bld .bflag{position:absolute;top:10px;right:10px;font-family:var(--f-disp);font-size:8px;color:var(--cyan);letter-spacing:1px}
.idcard{background:var(--panel);border:3px solid var(--gold-dk);box-shadow:5px 5px 0 var(--shadow);padding:16px 22px;display:inline-block;text-align:left;margin:14px 0}
.idcard .role{font-family:var(--f-disp);font-size:9px;color:var(--gold);letter-spacing:2px}
.idcard .nm{font-size:26px;font-weight:900;margin:4px 0 2px}
.idcard .sid{font-size:12px;color:var(--dim);font-family:var(--f-mono)}
.namein{font-family:var(--f-body);font-size:16px;background:var(--bg2);color:var(--fg);border:3px solid var(--line2);padding:10px 14px;width:240px;max-width:100%}
.namein:focus{outline:none;border-color:var(--gold)}
@media (pointer:coarse){.namein{font-size:16px}}
/* 文件卡 / TU 展开视图 / 符号表 */
.fcards{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.fcard{background:#0d1024;border:3px solid var(--line);box-shadow:3px 3px 0 var(--shadow);padding:9px 12px;font-family:var(--f-mono);font-size:12.5px;line-height:1.7;min-width:0;flex:1 1 180px;overflow-x:auto}
.fcard .fh{font-family:var(--f-disp);font-size:8px;color:var(--cyan);margin-bottom:6px;letter-spacing:1px}
.tuwrap{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.tu{flex:1 1 280px;min-width:0;background:#0d1024;border:3px solid var(--line2);padding:10px 12px;font-family:var(--f-mono);font-size:12.5px;line-height:1.8;overflow-x:auto}
.tu .th{font-family:var(--f-disp);font-size:8px;color:var(--gold);margin-bottom:6px;letter-spacing:1px}
.dup{color:var(--red)!important;background:rgba(255,93,115,.13);display:inline-block;padding:0 4px}
.symtab{background:#0d1024;border:3px solid var(--line);margin:10px 0;font-family:var(--f-mono);font-size:13px}
.symtab .sr{display:flex;gap:14px;padding:5px 12px;border-bottom:1px solid #1c2244}
.symtab .sr:last-child{border-bottom:none}
.symtab .sh{color:var(--faint);font-size:12px;padding:5px 12px}
.symtab .err{color:var(--red);background:rgba(255,93,115,.08);padding:6px 12px}
.copybox{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
.cbox{flex:1 1 180px;min-width:160px;background:#0d1024;border:3px solid var(--line2);padding:12px;text-align:center;font-family:var(--f-mono)}
.cbox .cl{font-family:var(--f-disp);font-size:8px;color:var(--cyan);margin-bottom:8px;letter-spacing:1px}
.cbox .cv{font-size:22px;color:var(--gold)}
.cbox .cs{font-size:12px;color:var(--faint);margin-top:6px}
/* 课时行 / 掌握度 */
.lessonrow{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:10px 14px;margin:0 0 10px;cursor:pointer}
.lessonrow:hover:not(.locked){border-color:var(--line2)}
.lessonrow.done{border-color:#2c7c4a}
.lessonrow .ln{font-family:var(--f-disp);font-size:9px;color:var(--gold);flex:none;padding-top:3px}
.lesson-context{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:0 0 10px;color:var(--dim);font-size:13px}
.lesson-tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.stagebar button.st{font:inherit;cursor:pointer;color:var(--dim)}
.stagebar button.st:hover{border-color:var(--cyan);color:var(--fg)}
.stagebar button.st.now{border-color:var(--gold);color:var(--gold)}
.lesson-outline{border:2px solid var(--line);padding:10px 14px;margin-bottom:14px;background:var(--panel)}
.lesson-outline summary{cursor:pointer;color:var(--cyan)}
.lesson-outline ol{padding-left:24px;margin-bottom:0}
.lesson-outline li{margin:6px 0}
.lesson-outline button{font:inherit;text-align:left;color:var(--fg);background:var(--bg2);border:1px solid var(--line);padding:6px 9px;cursor:pointer;width:100%}
.lesson-outline button:hover{border-color:var(--cyan)}
.review-banner{border-left:3px solid var(--cyan);padding:9px 12px;margin:0 0 12px;background:var(--panel2);font-size:13px}
.lecture #board .cap{position:static;display:table;max-width:100%;margin:0 0 12px;font-family:var(--f-body);font-size:12px;letter-spacing:0}
#lesson-help{line-height:1.9}
#board pre{word-break:normal;overflow-wrap:anywhere}
.op-caption{font-size:13px;color:var(--dim);margin:8px 0}
.symtab .sr{flex-wrap:wrap;overflow-wrap:anywhere}
.symtab .sr.active{background:rgba(255,210,63,.1);border-left:3px solid var(--gold)}
.mrow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.mchip{font-size:12px;font-weight:700;border:2px solid var(--line2);padding:3px 10px;background:var(--bg2);color:var(--faint)}
.mchip.s1{color:var(--dim)}
.mchip.s2{color:var(--cyan);border-color:#2a6a86}
.mchip.s3{color:var(--green);border-color:#2c7c4a}
/* 误区笔记本 */
.note{border:3px solid var(--line);background:var(--bg2);padding:10px 14px;margin:10px 0;font-size:13.5px}
.note .n1{color:var(--red)}.note .n2{color:var(--cyan)}.note .n3{color:var(--gold)}
.note .nact{margin-top:8px}
/* 考核 */
.examq{border:3px solid var(--line);background:var(--panel);padding:12px 14px;margin:10px 0}
.examres{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.examres .rq{font-family:var(--f-mono);font-size:12px;border:2px solid var(--line);padding:3px 9px}
.examres .rq.ok{color:var(--green);border-color:#2c7c4a}
.examres .rq.ng{color:var(--red);border-color:#8a3040}
@media (prefers-reduced-motion:reduce){
  .bob,#speech .hint{animation:none}
  .opts button.bad{animation:none}
}
.repair-edit{display:block;width:100%;min-height:115px;resize:vertical;padding:12px;background:#0d1024;color:var(--chalk);border:3px solid var(--cyan);font:14px/1.75 var(--f-mono)}
.repair-edit:focus{outline:2px solid var(--gold);outline-offset:2px}
.repair-code{margin:8px 0;background:#0d1024;border:2px solid var(--line);padding:10px;overflow-x:auto}
.repair-code pre{font:13px/1.75 var(--f-mono);margin:0;white-space:pre-wrap}
.repair-feedback{margin:10px 0;min-height:22px}
</style>

<div id="wrap">
<div id="status">
  <span class="lv" id="st-lv">LV 1</span>
  <span class="grow xpbar"><i id="st-xp" style="transform:scaleX(0)"></i></span>
  <span class="dim" id="st-misc">XP 0 · 通关 0/13</span>
  <button id="bt-sfx" title="开关提示音" aria-pressed="true">音效 开</button>
  <button id="bt-music" title="开关低音量背景音乐" aria-pressed="false">音乐 关</button>
  <button id="bt-reset">重开</button>
</div>

<section id="scr-title">
  <div class="sub">XINDONG PLAN · C++ ACADEMY</div>
  <h1>C++ 学院</h1>
  <div class="logo2 dim">在虚拟大学里，修完一门 C++ 课</div>
  <div style="margin:24px 0 6px"><span class="pixelbox"><canvas id="hero" class="bob"></canvas></span></div>
  <div class="small dim" style="max-width:520px;margin:10px auto 18px">
    从概念介绍和板书示范开始，再动手实验、参加练习。随时举手提问，
    带着自己的误区去办公室复习，逐章完成考核。
  </div>
  <button class="btn" id="bt-start">进入学院</button>
</section>

<section id="scr-enroll" hidden></section>
<section id="scr-campus" hidden></section>
<section id="scr-class" hidden></section>

<section id="scr-office" hidden></section>

<script>const LEVELS=[];</script>
<script>
/* ====== 第 1~4 关 ====== */
LEVELS.push(
{ id:"L01", name:"编译模型", ch:"头文件 / 链接 · ~35 题", diff:2,
  intro:"进学院第一课:编译器到底怎么处理你的代码。后面每一关的\"为什么\",都会回溯到这一关。",
  teach:[
    {cap:"板书 1 · 四个阶段",
     lines:["main.cpp ─预处理→ main.i ─编译→ main.s",
            "         ─汇编→ main.o ─链接→ main",
            "",
            "预处理  展开 #include/#define，删注释",
            "编译    语法/类型检查，报【编译错误】",
            "汇编    .s → 机器码 .o",
            "链接    把多个 .o 拼起来，报【链接错误】"]},
    {cap:"板书 2 · 复印机与 ODR",
     lines:["include = 把头文件文本【复印】一份贴进来",

{ id:"L08", name:"模板", ch:"指定薄弱点 · ~12 题", diff:3,
  intro:"模板是\"图纸的图纸\":编译器按你的实参现场画图纸、盖房子。所以每种实例化都有一套自己的 static——这是本关的钥匙。",

    {cap:"板书 2 · 定义放哪",

            "",
            "匹配优先级：全特化 > 偏特化 > 主模板",
            "template<typename U> struct Foo<int,U>",
            "template<typename T> struct Foo<T,T>"]}],
  qs:[
    {q:"template<typename T> int f(T x){ static int c=0; return ++c; }  依次调用 f(1); f(2); f(1.5); f(3);  最后一次返回？",

     why:"f(1)、f(2)、f(3) 都是 f<int> 那一套,c 从 0 涨到 3;f(1.5) 是 f<double> 另一套,自己的 c 只到 1。最后 f(3) 返回 3。\"一个模板一个函数\"的直觉在这里死掉。出处:TM 课 count.cpp 实跑 1 2 1 3;insttab 实例化对照表逐调用判定。"},
    {q:"函数模板的定义应该放在哪？",

     why:"隐式实例化通常要求定义对使用者可见，所以通常把模板定义放进头文件。模板具有自己的 ODR 规则，不是因为 template 自动带来 inline。显式实例化等组织方式也可把具体实例集中在一个源文件中。出处:HD 课 tpl.h+a.cpp+main.cpp 两个 TU 实跑 42 20;定义留 .cpp(undefined reference)与特化位置(incomplete type)均实跑。"},
    {q:"template<typename T> T max(T a, T b);  调用 max(4, 4.2) 会怎样？",
     opts:["T 被推成 int,4.2 截断","T 被推成 double","编译错误——两个实参推导出不同的 T","运行时错误"],ci:2,
     why:"一个模板参数只能推一个 T:4 说 int,4.2 说 double,谁也不让谁。显式指定 max<double>(4, 4.2) 让 4 自己转型,编译才通过。推导失败是模板题的第一大报错。出处:DD 课 deduce.cpp(9 / 4.2)与 deducetab 推导判定表;conf.cpp 报 no matching function 实跑。"},
    {q:"类内定义的成员函数、模板、constexpr 函数,凭什么能安全地出现在头文件里？",
     opts:["编译器自动给它们加了 static","它们隐含 inline,ODR 明确允许跨 TU 重复定义,链接器取其一","const 默认外部链接","因为它们不生成代码"],ci:1,

  boss:{q:"BOSS · 偏特化匹配。Foo<int,double>::i 是多少？",

{ id:"L09", name:"STL 容器", ch:"标准库权重最大 · ~32 题", diff:3,

{ id:"U", title:"auto：编译器替你写类型", kp:"kp_auto",

  steps:[
  {k:"board",stage:"intro",cap:"接上节课 · 让编译器推类型",

   d:"auto 的规则只有一句话：按初始化表达式推类型，再按值拷贝的规矩“去引用、去顶层 const”。听起来抽象，我们用四组对照把它拆开。这节课最要紧的是：推导结果不一定等于右边表达式的类型。",
   help:"把 auto 想成一个抄写员：它抄的是“值的类型”，不是“表达式的全部修饰”。引用和顶层 const 是修饰，抄写时被抹掉；想保留就明写 auto& 或 const auto&。"},
  {k:"board",stage:"example",cap:"示范 1 · auto 丢引用",

   help:"引用不是对象，它没有自己的存储。auto 要定义一个新对象，新对象总得有自己的存储，所以引用关系天然断开——想保持别名，就明写 auto&。"},
  {k:"board",cap:"示范 2 · 顶层 const 丢，底层 const 留",

   help:"一句话：复制的是“值”，值不带“我自己是常量”这个属性；但“我指向的东西只读”是地址的属性，会跟着地址一起复制过去。"},

{ id:"X", title:"四种 cast：把转换写明", kp:"kp_cast",
  goal:"为一次转换选对 cast：static 管相关类型，dynamic 管多态下行，const_cast 只动 const，reinterpret 最危险。",
  found:"static_cast 编译期完成、失败即编译错误；dynamic_cast 运行期检查，失败对指针返回 nullptr；const_cast 修改真常量是未定义行为；reinterpret_cast 零检查、最危险。",
  steps:[
  {k:"board",stage:"intro",cap:"接上节课 · 明写的转换",
   lines:["上节课：auto 让编译器算类型","本课：转换不靠隐式，四种 cast 各管一段","","本课目标","① static_cast：相关类型，编译期完成","② dynamic_cast：多态下行，运行期检查","③ const_cast / reinterpret_cast：特殊工具，慎用"],
   d:"C++ 允许隐式转换，但隐式的代价是看不见。四种具名 cast 把转换写明白，每种管一段、失败方式不同。这节课先学最常用的 static_cast，再认识其余三个的分工。",
   help:"把四种 cast 想成四种关卡：static 是普通安检（编译期查类型是否相关），dynamic 是实名验证（运行期确认真实身份），const_cast 是临时通行证（只动 const 权限），reinterpret 是硬闯（重新解释位模式）。"},
  {k:"board",stage:"example",cap:"示范 · static_cast 与整数除法",
   lines:["double avg = static_cast<double>(5) / 2;","// 先转再做除法：5.0 / 2 == 2.5","","int n = static_cast<int>(3.9);   // 3，截断小数","double m = 5 / 2;                // 整数除法先算：m == 2.0","","顺序是关键：转换发生在除法之前还是之后"],
   d:"static_cast 处理“相关类型之间”的转换，编译期完成。两个高频用法：一是整数除法想得小数，先把其中一个操作数转成 double，除法就在浮点下进行；二是浮点转整数，直接截断小数。注意第三行：5/2 先按整数除法算出 2，再转 double，得 2.0——转换晚了，结果就不同了。",
   help:"为什么 static_cast<double>(5)/2 是 2.5？除法看操作数类型：一边是 double，另一边的 2 被提升成 double，结果 2.5。若不转换，5/2 是整数除法，得 2。"},
  {k:"probe",
   q:"想让 avg = 5 / 2 得到 2.5，哪一行正确？",
   code:["① double avg = 5 / 2;","② double avg = static_cast<double>(5) / 2;","③ double avg = static_cast<double>(5 / 2);"],
   opts:["①","②","③"],ci:1,
   why:"② 先把 5 转成 double，除法在浮点下进行，得 2.5。① 里 5/2 先按整数除法算出 2，再转 double 成 2.0；③ 转换发生在除法之后，同样是 2.0。顺序是关键：先转，再做除法。"},
  {k:"board",cap:"概念 1 · dynamic_cast：运行期验明正身",
   lines:["struct Base { virtual ~Base() = default; };","struct Derived : Base { };","","Derived d;  Base* pb = &d;","dynamic_cast<Derived*>(pb)   // 成功：得到 &d","","Base b2;    Base* pb2 = &b2;","dynamic_cast<Derived*>(pb2)  // 失败：返回 nullptr","","检查在运行期：看对象的真实身份"],
   d:"dynamic_cast 做多态类型的向下转换，检查发生在运行期：看对象真实身份是不是目标类型。是，转换成功；不是，对指针形式返回 nullptr——这是它和 static_cast 最大的区别，static_cast 一律相信你，不检查。",
   help:"为什么要求多态？运行期检查靠虚函数带来的类型信息，所以类至少要有一个虚函数（常见做法是虚析构）。没有虚函数，这行 dynamic_cast 连编译都过不了。"},
  {k:"board",cap:"概念 2 · 剩下两位：特殊工具",
   lines:["const_cast<int&>(cr)      // 只动 const 权限，对象不变","// 用于“接口只收 const，内部确定没改”的场景","// 改一个真正定义成 const 的对象：未定义行为","","reinterpret_cast<char*>(&v)  // 位模式重新解释","// 与硬件、序列化打交道才用","// 最危险：类型系统完全不设防"],
   d:"const_cast 专门加减 const：它不改变对象，只是放开“通过这个引用或指针写”的权限。注意边界——如果对象本来就定义成 const，写它是未定义行为。reinterpret_cast 只重解释位模式，不做任何检查，考试里它永远是“最危险”的那一个。",
   help:"记住两个“不要”：不要用 const_cast 改真常量，不要用 reinterpret_cast 侥幸跨类型访问。它们存在是为了对接旧接口和底层操作，不是日常工具。"},

  {k:"board",cap:"概念 · 覆盖的契约与 override",

   d:"覆盖是严格契约：函数名、参数表、const 修饰，一样都不能差。差任何一点，派生类写的就是一个新函数，把基类版本藏起来——这叫隐藏，下一课专门拆。override 关键字本身没有行为，它是给编译器的检查委托：你声明“这是覆盖”，签名对不上它立刻报错。题库里 Display 那道 const 差异题，考的就是这条契约。",
   help:"使用习惯：凡是想覆盖的函数一律写 override。写对了没有代价，写错了编译器替你抓——这比运行起来才发现“多态没生效”便宜得多。"},
  {k:"probe",
   q:"基类 virtual void F() const; 派生类 void F() override; 会发生什么？",
   opts:["正常覆盖——名字参数都一样","编译错误——签名差一个 const，不构成覆盖","运行时才报错","派生版本被忽略"],ci:1,
   why:"const 属于签名。差一个 const，D::F 就不是覆盖，override 检查当场失败：marked override, but does not override。去掉 override 它能编译，但那是隐藏——通过基类指针调到的仍是基类版本。"},
  {k:"scene",
   cap:"课堂案例 · 差一个 const 的代价",
   d:"桌上的 hide.cpp：D::F 少写了 const，没构成覆盖。p->F() 和 d.F() 是两个不同静态类型的调用，分别会走到哪个版本？按四步图推一遍。",
   files:CH7_FILES.hide},
  {k:"predict",
   q:"输出是什么？",
   opts:[
    {t:"D D——名字一样，都跑派生的",
     react:"这是把“同名”当成“覆盖”。签名差一个 const，D::F 根本没进 vtable 的覆盖位置——运行期查表查不到它。看黑板逐步走一遍。",
     mis:"我原来以为函数名相同就是覆盖；实际签名必须完全一致，const 也在签名里，差一个就是隐藏。"},
    {t:"B D——p->F() 查表只找到 B 版，d.F() 静态类型是 D 走 D 版",
     react:"对。D::F 没覆盖，表里 F 仍指向 B::F，p->F() 调到 B 版；d.F() 的静态类型是 D，普通调用直接命中 D::F。"},
    {t:"编译错误——签名不一致不让编译",
     react:"不写 override 时这只是合法的隐藏，编译能过。一旦写了 override，这里才会变成编译错误。危险的不是报错，是它悄悄通过。"}]},
  {k:"op", kind:"dispatch",
   d:"我们把 p->F() 的完整一生走一遍：编译期两步，运行期两步。每次点击黑板同步更新。",
   react:"四步走完：编译期只认静态类型，运行期才查表定版本。记住分工——编译期负责“合法性”，运行期负责“选版本”。"},
  {k:"board",cap:"概念 · 虚析构：必写项",
   lines:["A* p = new C;   delete p;","","~A 不写 virtual：未定义行为","（常见现象：只跑 ~A，C 的析构根本不执行）","~A 写了 virtual：沿虚机制找到真实类型 C","整条析构链逆序跑完：~C → ~B → ~A","","规则：多态基类的析构函数一律 virtual"],
   d:"delete p 时编译器只看得见 p 的静态类型 A*。析构不是虚函数，它就按静态类型调 ~A——C 的析构被跳过，C 里申请的资源泄漏，标准把这种情况定为未定义行为。析构一旦是虚函数，delete 也走查表那一套：找到真实类型 C，从最派生开始逆着构造顺序把整条链跑完。这就是“多态基类析构一律 virtual”的全部理由。",
   help:"把析构链想成“拆机器的完整流程”：delete 只按说明书（静态类型）办事，virtual 让它先看机器铭牌（真实类型）再拆。忘了 virtual，它就按说明书只拆基座——加盖的部分悬在半空。"},
  {k:"probe",
   q:"要让 delete p（A* 指向 C 对象）跑出 ~C → ~B → ~A，A 的析构需要满足什么？",
   opts:["是 public 的","是 virtual 的——析构沿虚机制定位真实类型，再逆序跑完整条链","什么要求都没有，顺序自动正确","是 const 的"],ci:1,
   why:"析构写成 virtual，delete 才会经 vptr 找到动态类型 C，从 ~C 开始逆序跑完整条链。析构的可见性、const 都与此无关——决定“按静态还是动态类型执行”的，只有 virtual。"},
  {k:"board",stage:"recap",cap:"课末回顾 · 多态的机制清单",
   lines:["① 编译期：检查静态类型里的虚函数 → 合法性","② 运行期：vptr → vtable → 选版本","③ 覆盖契约：签名完全一致（含 const）","④ override = 检查器，不改变虚性","⑤ 多态基类析构一律 virtual","","独立练习：给“隐藏”留一个入口"],
   d:"五条收拢。注意第⑤条的考试形态：题库的 Derive2→Derive1→Base 输出题、以及“哪种 delete 是 UB”判断题，全从它出。独立练习换个角度考覆盖。"},
  {k:"variant",
   q:"独立练习：struct B { virtual ~B(){ printf(\"~B \"); } }; struct D : B { ~D(){ printf(\"~D \"); } }; 局部对象 D d 离开作用域，输出什么？",
   code:["{","    D d;","}   // 离开作用域"],
   opts:["~D ~B——析构从叶往上","~B ~D——和构造同序","~D——只析构派生层","~B——只析构基层"],ci:0,kp:"kp_virtual",
   why:"离开作用域直接析构完整对象，不走基类指针，本就不需要查表：顺序永远是逆着构造——~D 先、~B 后。虚析构解决的是“delete 基类指针”这一种场景，不是所有析构的前置条件。"}
]},
{ id:"H", title:"隐藏与静态绑定", kp:"kp_hiding",
  goal:"区分动态绑定与静态绑定的分界，解释默认参数为什么看静态类型，追踪构造期间的虚函数调用。",
  found:"函数体：虚→动态绑定（运行期查表），非虚→静态绑定（编译期按静态类型）。默认参数永远静态绑定。派生类同名函数隐藏基类全部同名重载。构造/析构期间虚函数只到当前层。",
  steps:[
  {k:"board",stage:"intro",cap:"接上节课 · 没构成覆盖时，发生什么？",
   lines:["上节课：覆盖 = 签名完全一致 + 查表","本课：三件事都没走“查表”这条路","","本课目标","① 非虚同名函数：静态绑定","② 默认参数：永远静态绑定","③ 构造/析构期间：虚机制只到当前层"],
   d:"上一课的钥匙句“函数体看动态类型，其余看静态类型”，这节课来兑现后半句。三组高频考题——非虚同名、默认参数、构造期调用——全都是“编译期就定了”的案例。我们把它们并排拆开。",
   help:"预告一个反直觉点：默认参数不是函数的一部分吗？是——但它是“调用方”在编译期填进去的，填的是指针类型的默认值，不是对象类型的。下面细看。"},
  {k:"board",stage:"example",cap:"示范 · 同一行代码，三种绑定",
   lines:["B* p = &d;","","p->F();      F 是虚函数   → 动态绑定：查表 → D::F","p->Bar();    Bar 非虚同名 → 静态绑定：B::Bar","p->G();      G 虚函数,默认参数 x=10","             → 身体 D::G,默认值 10（B 的！）","","口诀：身体看动态类型，默认值看静态类型"],
   d:"同一根指针，三种命运。虚函数 F 在运行期查表，跑 D 的身体；非虚的 Bar 不查表，编译期按 p 的类型定了 B::Bar；最隐蔽的是 G：身体查表跑 D::G，但默认参数是编译期按静态类型 B 填的——用的是 B 里的 10。题库的 Func1 输出 100 那道题，考的就是第三种。",
   help:"为什么默认参数不看对象？因为默认值是在“写调用的那行代码”处填进去的，编译器此刻只知道 p 的类型。对象的 vptr 运行期才有——填默认值轮不到它。"},
  {k:"probe",
   q:"struct B { void Bar(){...} }; struct D : B { void Bar(){...} };（都不是虚函数）B* p = &d; p->Bar(); 执行谁的 Bar？",
   opts:["D::Bar——对象是 D 的","B::Bar——非虚函数静态绑定，按指针类型","编译错误——二义性","未定义行为"],ci:1,
   why:"非虚函数不查表：编译期按 p 的静态类型 B* 定了 B::Bar。派生类的 Bar 在这里只是把基类版本藏住了。想跑 D::Bar，要么写成虚函数，要么用 D 类型的指针/引用调用。"},
  {k:"scene",
   cap:"课堂案例 · 默认参数的错位",
   d:"桌上的 defaultarg.cpp：F 是虚函数，基类默认 10、派生默认 20，两处调用分别是 B* 和 D。按“身体动态、默认值静态”推一遍输出。",
   files:CH7_FILES.defaultarg},

   q:"输出是什么？",

    {t:"D20 D20——都跑派生版本，都拿 20",
     react:"身体确实都是 D::F（虚函数查表）。但第一次调用的默认值按 p 的静态类型 B 填——是 10 不是 20。",
     mis:"我原来以为默认参数跟着对象走；实际默认值在编译期按静态类型填，身体的版本和默认值可以来自不同的类。"},
    {t:"D10 D20——身体都是 D 版，默认值各自看静态类型",

    {t:"B10 D20——第一次连身体都是 B 版",

  {k:"op", kind:"bindtwo",
   d:"我们把一次调用里的三个部分逐个归位：哪部分查表，哪部分看指针。",
   react:"三行归位：虚函数体查表（动态），默认参数和非虚函数看静态类型（编译期）。一道题里三处考点，全部用这一张分界表判断。"},
  {k:"board",cap:"概念 · 隐藏的第二层：整个重载集被藏住",
   lines:["struct B { void f(int); void f(double); };","struct D : B { void f(char); };","","D d;  d.f(42);","查找从 D 开始 → 命中 f(char) → 停止","B 层的 f(int)/f(double) 全部不可见","42 经隐式转换落到 f(char)"],
   d:"名字查找有个规则：从使用处向外找，找到一层就停。D 里有 f，查找就停在 D 层——基类的 f(int)、f(double) 整组重载全部被藏住，不是“补充进来一起比”。于是 42 只能在 D 层的重载里挑，经隐式转换落到 f(char)。想恢复整套，用 using B::f; 把基类重载集引进来。",
   help:"对照第二章的变量遮蔽：局部遮蔽全局，这里派生层遮蔽基层——同一套“先到先停”的查找规则。区别是函数会做重载决议，但候选集只有停下那一层的。"},
  {k:"probe",
   q:"接上例：d.f(42) 实际调用的是？",
   code:["struct B { void f(int){ printf(\"B.f(int) \"); }","           void f(double){ printf(\"B.f(double) \"); } };","struct D : B { void f(char){ printf(\"D.f(char) \"); } };","D d;  d.f(42);"],
   opts:["B.f(int)——最匹配的版本","D.f(char)——查找停在 D 层，42 经转换落入","编译错误——没有精确匹配","B.f(double)——浮点更接近"],ci:1,
   why:"重载决议只在“查找停下那一层”的候选里进行。D 层只有 f(char)，42 隐式转换成 char 调用 D.f(char)。实跑确认。这就是“派生类同名函数隐藏基类重载”的完整含义——很多同学以为基类的 f(int) 还能参与竞争。"},
  {k:"board",cap:"概念 · 构造期间：虚机制只到当前层",
   lines:["struct B { B(){ hello(); }","           virtual void hello(){ printf(\"B.hello \"); } };","struct D : B { void hello() override { ... } };","","new D → 构造 B 时调用 hello()","→ 跑 B::hello（D 层还没构造，表还是 B 的）","","构造/析构期间：虚函数调用只落到当前（正在构造的）层","构造 / 析构中对当前对象虚调用纯虚函数 → 未定义行为"],
   d:"构造 B 的时候，D 的部分还不存在——对象的 vptr 此刻指向 B 的表。所以构造函数里调虚函数，跑的是本层版本；等 D 部分构造完，vptr 才换到 D 的表。这就是“构造期间虚机制没接好”的机理：不是失效，是按部就班地只到已构造的那层。若从构造或析构函数直接或间接对正在构造或析构的对象进行纯虚函数的虚调用，行为未定义，不能保证一定以某种方式中止。",
   help:"把 vptr 想成随施工进度翻页的表格：盖到哪层，表就是哪层的。题库里若遇到构造期间对当前对象虚调用纯虚函数，应判断为未定义行为，不应依据某次崩溃猜固定输出。"},
  {k:"probe",
   q:"D d; 构造过程中（B 的构造函数里）调用 hello()，执行谁的？随后 d.hello() 又执行谁的？",
   code:["struct B { B(){ hello(); }","           virtual void hello(){ printf(\"B.hello \"); } };","struct D : B { void hello() override { printf(\"D.hello \"); } };"],
   opts:["两次都是 D.hello——虚函数总是跑派生版","两次都是 B.hello——虚机制在构造期完全失效","先是 B.hello（构造 B 时表是 B 的），随后 D.hello","编译错误——构造函数不能调虚函数"],ci:2,
   why:"构造 B 时，vptr 指向 B 的表，hello 落到 B::hello；构造完成后 vptr 换成 D 的表，d.hello() 才是 D::hello。实跑输出 B.hello D.hello。虚机制没有“失效”，只是逐层接通。"},
  {k:"board",stage:"recap",cap:"课末回顾 · 静态绑定的三张脸",
   lines:["① 非虚同名函数：按指针的静态类型","② 默认参数：按指针的静态类型（身体可以不是）","③ 构造/析构期间：虚函数落到当前层","④ 同名新函数藏住基类整个重载集（using 可找回）","⑤ 检查工具：身体动态？默认值静态？查找停在几层？","","独立练习：把覆盖契约补完整"],
   d:"三条静态绑定规则收拢，外加隐藏的重载集规则。答题时先问三个问题：这半边查表吗？这个值编译期填吗？查找停在几层？独立练习把覆盖契约和 override 串起来。"},
  {k:"variant",
   q:"独立练习：想让“通过基类指针调用时执行派生版本”成立，除了函数体逻辑，声明上必须保证什么？",
   opts:["派生类函数前加 virtual 就够","基类写 virtual，且派生类签名完全一致（含 const）——最好再加 override","两边都写 virtual，参数可以不同（编译器就近匹配）","把函数设为 static 即可"],ci:1,kp:"kp_hiding",
   why:"动态绑定需要两个条件同时成立：基类声明为 virtual（有表可查），派生类签名完全一致（真的写进了表的覆盖位置）。参数不同就成了隐藏，编译期直接按静态类型走。override 不改变绑定，但能当场抓出“以为覆盖了其实没有”的错误。"}
]},
{ id:"C", title:"切片与抽象类", kp:"kp_slice",
  goal:"识别切片发生的三种场景并写出保多态的写法，用纯虚函数设计接口，判断抽象类的派生是否可实例化。",
  found:"按值传参、按值赋值、按值捕获异常都会切片：只拷基类子对象，虚函数落到基类版。保多态用引用/指针。纯虚函数（= 0）是契约：含纯虚的类不能实例化，派生类不实现完所有纯虚仍是抽象类。",
  steps:[
  {k:"board",stage:"intro",cap:"接上节课 · 多态失效的两大场景",
   lines:["上节课：静态绑定的三种脸","本课：让多态彻底失效的两种写法","","① 切片：按值传递，派生部分被切掉","② 抽象类：契约没实现完，对象造不出来","","本课目标：识别它们 + 写出正确版本"],
   d:"本章最后一课讲“失效的两种方式”。切片是悄悄发生的——编译器不报错，多态没了；抽象类是明着拦截——编译器直接拒绝。一个考读输出，一个考类设计，都是题库高频。",
   help:"切片和隐藏都是“悄悄通过”型错误：编译通过、结果不对。这章学完，你遇到多态没生效，先查这两处。"},
  {k:"board",stage:"example",cap:"示范 · 切片：按值传递的代价",
   lines:["void Val(B o){ o.Who(); }   ← 按值形参","void Ref(B& o){ o.Who(); }  ← 引用形参","","Val(d)：拷贝构造一个 B——只搬走 B 子对象","          D 独有部分被切掉（这就是“切片”）","          o 的表是 B 的 → o.Who() 调 B::Who","Ref(d)：o 是 d 的别名 → o.Who() 调 D::Who","","按值赋值、按值捕获异常，同样切片"],
   d:"Val 的形参是 B 类型，传 d 进去时要构造一个 B 对象——拷贝只拷 B 子对象，D 的部分被切掉。切出来的 o 就是个货真价实的 B：表是 B 的表，虚函数调 B 的版本。这不是 bug，是拷贝语义的正常结果，但它有自己的名字——切片。引用版本里 o 只是 d 的另一个名字，什么都没切，多态完好。",
   help:"为什么拷贝只拷一半？B 的拷贝构造根本不知道 D 有多余的部分——它按 B 的尺寸要了一块地。想不切，就别拷贝：引用和指针都只“指向”，不复制。"},
  {k:"scene",
   cap:"课堂案例 · 一字之差：Val 与 Ref",
   d:"桌上的 slice.cpp 两个函数只差一个符号：Val(B o) 按值，Ref(B& o) 引用。同一个 d 传进去，输出各是什么？",
   files:CH7_FILES.slice},
  {k:"predict",
   q:"输出是什么？",
   opts:[

{ id:"DD", title:"推导与别名:一个 T 只能推一个答案", kp:"kp_tmdd",
  goal:"预判一次调用能否推出唯一 T;会写显式指定与别名模板;会造 Type2Type 临时对象。",
  found:"一个模板参数只能推出一个 T:两边实参类型不一致就是推导失败(no matching function)。救援是显式指定 tmax<double>(...)。typedef 不能带模板参数,别名模板(template using)才是正解。类型不是表达式:想把类型当实参递,先造 Type2Type<int>() 这样的空壳临时对象。",
  steps:[
  {k:"board",stage:"intro",cap:"接上节课 · 推导的规矩",
   lines:["上节课:定义放哪","本课:调用现场——编译器怎么从实参推 T","","本课目标","① 预判「能否推出唯一 T」","② 会用显式指定救援","③ 别名模板与 Type2Type"],
   d:"模板好用,一半功劳在推导:调用时不用写类型,编译器照实参自己算。但推导有条铁律——一个模板参数只能推一个答案。这条铁律一破,再聪明的编译器也不会替你挑:推导失败是模板题的第一大报错。这节课把它钉死,再补两件配套工具:别名模板与 Type2Type。",
   help:"把推导想成「投票」:每个实参投一票说 T 是什么类型。一个 T 只能收一张票——两张票不一致,投票失败,谁也不迁就谁。"},
  {k:"board",stage:"example",cap:"示范 · 推导成功与失败",
   lines:["template<typename T> T tmax(T a, T b){ return a > b ? a : b; }","","tmax(3, 9)         两票都是 int   → T=int   ✓ 返回 9","tmax(4, 4.2)       int + double   → 两票冲突 ✗","tmax<double>(4, 4.2) 显式指定      → T=double,4 转型 ✓ 4.2","","铁律:一个模板参数,一个答案","编译器不自动挑「更宽的类型」"],
   d:"tmax(3,9) 两票一致,推导顺利。tmax(4,4.2):4 说 int,4.2 说 double——模板参数只有一个 T,投票失败,实跑报 no matching function。注意编译器绝不「自动挑更宽的 double」:模板不聪明,它守规矩。救援是显式指定:tmax<double>(4, 4.2) 把 T 钉成 double,4 自己转型,返回 4.2——实跑 9 / 4.2 两行都对。",
   help:"「编译器很聪明,会自动选」是这片题群的根误区。模板的每一步都按规矩来:推不出唯一 T 就失败,绝不自作主张。"},
  {k:"scene",

  {k:"board",cap:"概念 · 别名模板:typedef 的模板版",

  {k:"board",cap:"概念 · Type2Type:把类型递给函数",
   lines:["函数实参是【对象】,模板实参是【类型】——两个世界","","想只靠「类型」选函数?先造一个空壳对象:","","template<typename T> struct Type2Type { typedef T OriginalType; };","","tag(Type2Type<int>())   ✓ 括号造出临时对象(实跑 got T)","tag(Type2Type<int>)     ✗ 类型不是表达式","                          实跑 expected primary-expression"],
   d:"Type2Type 是个空壳:里面只有一个 typedef,没有数据。它的全部用途是「把类型带进函数调用的世界」——Type2Type<int>() 加上括号,才从类型造出一个值初始化的临时对象,能当实参传、能让重载决议按它选函数。少写括号,就是把类型当表达式用,实跑报 expected primary-expression。这一行是「类型世界」与「对象世界」的分界线本身。",

{ id:"SP", title:"特化与偏特化:给特定形状单独画图纸", kp:"kp_tmspec",

  steps:[
  {k:"board",stage:"intro",cap:"接上节课 · 图纸的定制版",

   d:"主模板对所有类型一视同仁,但工程里常想「对某类类型另做一份」:int 开头的特殊处理、两个参数相同的走快速路径。这套机制叫特化,分三级。这节课先立判定规则,再拆本章最阴的一题:两个偏特化同时命中时发生什么——答案不是你以为的「谁特化谁赢」。",
   help:"把三级图纸想成印刷厂:默认版式(主模板)、针对「竖版」的版式(偏特化)、某本书的专属版式(全特化)。接到订单先找专属,再找类版,最后用默认。"},

{ id:"MI", title:"增删与失效:erase 的保命惯用法", kp:"kp_stlmis",

{ id:"CW", title:"闭包类的本质与接住方式", kp:"kp_laclo",

{ id:"EX", title:"异常与栈展开:谁接住,谁析构,何时 terminate", kp:"kp_exc",

  found:"catch 按引用接(const T&)是规范写法:切片免疫、无需拷贝;按值接多态异常会把派生部分切掉(GCC 还给 -Wcatch-value 警告)。throw 之后的栈展开按逆序析构沿途局部对象——RAII 在这里兑现:析构是唯一跟着异常走的清理。两条 terminate 红线:noexcept 函数抛出、栈展开中析构函数再抛(GCC 都给 -Wterminate 警告)。catch 里 throw; 重抛原对象,throw e; 拷贝一个新异常对象。",
  steps:[
  {k:"board",stage:"intro",cap:"接上节课 · 出错时的第二套流程",
   lines:["前三课:资源正常生灭","本课:出错时,资源怎么办?","","throw → 一路向上找 catch","  沿途局部对象【全部析构】","  = 栈展开(stack unwinding)","","三个问题贯穿全课:",

          "  沿途谁析构?",
          "  什么情况直接 terminate?"],

   help:"异常流程三问:谁接住(catch 写法)、谁析构(栈展开)、何时 terminate(两条红线)。"},

  found:"两个执行流未同步地访问同一普通对象且至少一个是写,构成数据竞争——行为未定义,不是「结果少一点」。volatile 只禁止编译器缓存优化,管不住原子性与顺序,不是同步原语。atomic 的 ++ 是原子的 read-modify-write,两线程各一万次恒 20000(语言保证);mutex 的 lock_guard 版同样恒 20000。CAS(compare_exchange_weak)允许伪失败——多转几圈,结果不变。",

   d:"死锁的经典配方是「交叉请求」:t1 攥着 m1 等 m2,t2 攥着 m2 等 m1——谁也不撒手,无限互等,deadlock.cpp 只编译不执行(跑了就是挂死)。三条出路:全程序统一锁序(按地址或编号加锁);std::lock(m1,m2) 让库用避免死锁的算法一次拿两把,C++17 的 scoped_lock 更是一步到位(lockavoid.cpp 实跑不死锁);以及根本不持锁做耗时操作。场景②是工程纪律:持锁期间不调用未知回调、不做 IO;场景③由 RAII 兜底——异常路径 lock_guard 析构照样解锁,这正是第十一章 RAII 信仰的又一次兑现。",
   help:"死锁 = 「我要的在你手里,你要的在我手里」:统一顺序,或让库一次拿齐——别让两条队伍互相插队。"},
  {k:"probe",

{ id:"AY", title:"async 与 future:惰性、一次性与交接", kp:"kp_async",

  found:"std::async 返回 future;默认策略是 async|deferred 二选一由实现定。launch::deferred 不创建线程:任务惰性,直到 get/wait 才在【调用者线程】上执行(deferred.cpp 实跑 get_id 相同)。future::get 一次一线:get 过之后 valid() 为假,再 get 是 UB。promise 与 future 配对传递一次性结果;promise 不可拷贝(编译错误);shared_future 可拷贝、可多次 get。",

{ id:"TS", title:"gtest 与测试设计:断言线、fixture 与 Fuzz", kp:"kp_gtest",
  goal:"写对 ASSERT/EXPECT 两条断言线;说出 fixture 的 SetUp 执行时机;数清参数化用例;说出 Fuzz 与 ASan 的定位。",
  found:"ASSERT_* 失败立刻退出当前用例函数,EXPECT_* 记录失败后继续往下走——后续代码依赖检查结果时必须用 ASSERT。TEST 写普通用例,TEST_F 带 fixture;fixture 的 SetUp/TearDown 在每个用例前/后各执行一次(不是整个套件一次);参数化 INSTANTIATE_N 个值就是 N 个用例。断言里禁止副作用(ASSERT(i++ > 1000) 一次失败会差两次)。地址消毒(ASan)在真机用 -fsanitize=address 触发过 heap-use-after-free;Fuzz 模糊测试用变异的外部数据打高风险模块——枚举类固定参数不适合自动变异。",
  steps:[
  {k:"board",stage:"intro",cap:"接上节课 · 从找 bug 到防 bug",
   lines:["前两课:bug 出了以后怎么办","本课:测试——让它根本别出","","gtest 两条断言线:",
          "  ASSERT_*  失败 → 中止本用例函数",
          "  EXPECT_*  失败 → 记录后继续",
          "",
          "本章如实标注:gtest 本机未装框架,",
          "  语法按官方文档口径教;",
          "  ASan(地址消毒)真机核验过"],
   d:"欢迎来到第三课。GDB 是事后追凶,测试是事前布防。gtest 的核心只有两条断言线:ASSERT 是断头线,EXPECT 是记录线——后面所有规则(fixture、参数化、断言副作用)都长在这两条线上。如实交代核验口径:本机没有装 gtest 框架,框架语法按官方文档口径教(与 GDB 文档核对同一先例);地址消毒是我们真机触发过的。",
   help:"本课一句话框架:ASSERT 断头,EXPECT 记录;fixture 管前后事,参数化管用例数。"},
  {k:"board",cap:"概念 1 · 两条断言线",
   lines:["ASSERT_EQ(a, b)   失败 → 立刻退出当前用例函数",
          "EXPECT_EQ(a, b)   失败 → 记录,继续往下走",
          "",
          "选型原则(q3 考点):",
          "  后续代码【依赖】这次检查结果 → ASSERT",
          "    例:先判空指针,再解引用",
          "      ASSERT_NE(p, nullptr);",
          "      EXPECT_EQ(p->id, 9);  ← 前面必须断头",
          "",
          "「EXPECT 更严格」是背反的重灾区"],
   d:"两条断言线的分工写在名字里:ASSERT 是断头线——失败立刻退出当前用例函数,后面的代码一行都不跑;EXPECT 是记录线——失败记一笔,继续往下走。选型的判断题是「后面的代码依不依赖这次检查」:先判空指针再解引用,判空必须用 ASSERT——用 EXPECT 的话,判空失败后解引用照样执行,直接把测试进程炸出段错误。「EXPECT 更严格」是题库里背反的重灾区:恰好说反了。",
   help:"断言线选型只问一句:「这条检查失败后,后面的代码还能跑吗?」不能跑→ASSERT;能→EXPECT。"},
  {k:"probe",
   q:"gtest 里 ASSERT_* 与 EXPECT_* 失败时的差别?(考核 q3 同型)",
   opts:["ASSERT_* 失败立刻退出当前用例函数;EXPECT_* 记录后继续","EXPECT 更严格,失败退出函数","两者都退出整个程序"],ci:0,
   why:"ASSERT 是断头线、EXPECT 是记录线——这是 q3 的原文答案。第二项把两条线说反了(背反重灾区);第三项夸大后果:失败中止的是【当前用例函数】,套件继续跑下一条用例,不是退出整个程序。",
   help:"「中止的粒度」是这条考点:一个用例函数,不是整个测试程序。"},
  {k:"board",cap:"概念 2 · fixture:前后事与用例数",
   lines:["class CatTest : public ::testing::Test {",
          "  void SetUp() override { cat.reset(new Cat); }",
          "};",
          "TEST_F(CatTest, NewCatMeows) { ... }",
          "",
          "关键(q411 考点):",
          "  SetUp/TearDown 【每个用例】前/后各执行一次",
          "    三个 TEST_F → SetUp 跑 3 次",
          "  ——用例之间因此互相独立",
          "",
          "参数化:INSTANTIATE 3 个值 → 3 个用例",
          "  (用例数 = 值的个数,数得清)"],
   d:"fixture 是给一组用例准备的公共环境:TEST_F 挂到 fixture 上,每个用例开跑前 SetUp 被调用一次、跑完后 TearDown 一次——注意单位是【每个用例】,不是整个套件;三个 TEST_F 就是三次 SetUp。这正是题库 Q411「每个用例执行运行前会执行的动作」的答案,也是「用例独立性」的保障:每个用例拿到的是崭新的环境,不是上一个用例的残局。参数化那边一条规则:INSTANTIATE 了几个值就是几个用例——Q414 数用例数的题,数值就行。",
   help:"fixture 像「每个客人一套新床单」:SetUp 是铺床,每来一位客人铺一次——不是开业时铺一次大家轮流睡。"},

   d:"欢迎回到第三章。这门课我们盯着“求值”两个字：每个表达式都交出一个值，有些还会顺手改变变量——这两件事常被混成一件，后面短路、求值顺序的送命题全都从这里长出来。今天先把它们掰开。",
   help:"把表达式想成“办事兼汇报”：++a 办的事是给 a 加一，汇报的值是加完之后的数。办事（副作用）和汇报（值）可以分开理解——这节课就是学怎么分开。"},
  {k:"board",cap:"概念 · 值与变化同时发生，但互不相同",

   d:"a++ 和 ++a 都做了两件事：给 a 加一（副作用），再交出一个值。a++ 交的是加之前的旧值，++a 交的是加之后的新值——差别只在交出去的版本，副作用本身一毫秒都不会迟到。很多同学的误区是“后置的 ++ 可能不执行”，我们把这条先钉死。",
   help:"判断口诀：“读前缀看新，读后缀看旧”。两个都要自增，问的只是表达式本身是几。把“值”和“变化”分开记，后面所有 ++ 题都是送分题。"},

{ id:"SC", title:"短路求值：右边到底执行了吗", kp:"kp_short",
  goal:"给一段含 && 与 || 的代码，指出哪些调用真的执行了，并用短路解释守卫式写法为什么安全。",
  found:"&& 与 || 先完整求值左边；左边能定住整个表达式的结果时，右边根本不执行——副作用跟着一起消失。左边一定执行。",
  steps:[
  {k:"board",stage:"intro",cap:"接上节课 · 分组之后的“算不算”",

   d:"第三课讲“算不算”。&& 和 || 有个特权：左边一旦能定住结果，右边整个表达式——包括它的所有副作用——根本不会执行。上一课“副作用一定发生”要加半句：除非这行代码根本轮不到它。",
   help:"短路的直觉：&& 是“两个都要真”，左边已经假了，右边再真也翻不了案——所以干脆不问它。|| 是“一个真就行”，左边真了，右边没有发言权。"},
  {k:"board",cap:"概念 · 左先求值，右边可能缺席",
   lines:["规则只有两条：","","① 左边【一定】先完整求值","   （它的副作用都发生）","② 左边能定结果 → 右边不执行","   && 左假定假；|| 左真定真","","左边不能定结果 → 右边照常执行","","这条顺序是标准规定的，不是巧合"],
   d:"两条规则记牢：左边永远先算完整——包括它的函数调用和副作用；然后看它能不能单独定结果。&& 左边假，结果必假，右边不执行；|| 左边真，结果必真，右边不执行。不能定结果时右边照常执行，两边都算。",

  {k:"board",stage:"example",cap:"示范 · 守卫惯用法",

   help:"把守卫想成“先查门票再进场”：左半查票，右半是场内动作。顺序错了等于先进场再查票——查到没票时人已经在禁区里了。"},
  {k:"probe",

{ id:"EO", title:"求值顺序与 C++17：确定、未指定、未定义", kp:"kp_order",
  goal:"把一段代码的求值事件排成正确顺序，并把实例准确归入“确定顺序 / 未指定 / 未定义行为”三档。",
  found:"C++17 三档：有些运算符自带顺序（= 右先于左、<< 左先于右、&& || ?: , 左先）；函数实参之间未指定但不交错（不是 UB）；无序的冲突访问（如 i++ + i++）才是 UB。GCC 的警告在这里偏保守。",
  steps:[
  {k:"board",stage:"intro",cap:"接上节课 · 从一条顺序到一张三档表",
   lines:["上节课：&& 保证“左先右后”","本课：把整个语言的求值顺序","归成三档","","① 有确定顺序（标准规定）","② 未指定（不保证谁先，但不是 UB）","③ 未定义行为（UB）","","上一课的旧口诀要更新了"],
   d:"最后一课把“顺序”摊开。同一行代码里两个动作，谁先谁后？答案不是一句话，是三档：有的运算符自带顺序；有的地方标准故意不规定（但禁止交错）；只有“无序的冲突访问”才是未定义行为。题库里“一个语句改两次就是 UB”的旧说法，这节课正式更新。",
   help:"三档的比喻：①有排班表（标准规定谁先）；②没排班表但禁止插队（谁先都行，各干各的）；③没人管秩序（可以发生任何事）。判断题就是问：这段代码在哪一档？"},
  {k:"board",cap:"概念 · C++17 的三档表",
   lines:["① 有确定顺序：","   a = f()   右边先算（f 先于写入 a）","   cout << x << y   左先于右","   a[i]   a 先于 i 求值","   &&  ||  ?:  ,   左先于右","② 未指定（不交错）：","   f(g(), h())   实参之间先后不保证","③ 未定义行为：","   i++ + i++   无序的两次修改同一对象","   i + i++     无序的读 + 改同一对象","","口诀更新：看“有无顺序”，不看“改了几次”"],
   d:"三档表逐行看。第一档是标准白纸黑字的顺序：赋值右边先算完才动左边；<< 从左往右；下标 a[i] 先算 a 再算 i。第二档是函数实参：C++17 规定各实参求值不交错、都在函数体开始前完成，但谁先不保证——结果可能有两种，都合法。第三档才是 UB：+ 两侧没有顺序，i++ + i++ 是无序的两次修改。旧口诀“改两次就是 UB”错在第一档也能改两次（如 i=i++），也错在第二档不是 UB。",
   help:"判断流程：先问“这两个动作之间有没有运算符给的顺序？”有→第一档；没有→再问“它们冲突吗（同一对象一读一写或两写）？”不冲突→随便；冲突→UB。实参之间是特殊档：没顺序但禁止交错。"},
  {k:"board",stage:"example",cap:"示范 · i = i++ 在 C++17 里发生了什么",
   lines:["int i = 0;","i = i++;","","C++17 分解：","① 右边先完整求值：i++ 交出 0，i 变成 1","② 再执行赋值：把 0 写回 i","","结果：i = 0（确定，不是 UB）","","工程提醒：GCC 的 -Wsequence-point 偏保守，","这里仍会警告——提醒不等于 UB，","以标准语义判断为准"],
   d:"看这个被 C++17 修好的经典：i=i++。赋值规定右边先算完：i++ 交出 0、i 变 1；然后赋值把 0 写回。结果确定是 0。C++14 之前它是 UB，所以网上旧资料都喊危险——现在它是第一档。顺带一个诚实提醒：GCC 的检查器在这里偏保守，-Wall 仍会警告 may be undefined。提醒不等于事实，我们以标准语义判断——这也是这门课反复用的方法。",
   help:"为什么标准要管这个？因为 v[i] = i++ 这类写法在容器代码里真实存在，旧标准逼着所有人绕开。C++17 把赋值、移位、下标的顺序定死，这一片题从此有了唯一答案。"},
  {k:"probe",
   q:"按 C++17，int i = 0; i = i++; 之后 i 是多少？",
   opts:["1——自增发生了","0——右边先算完（交 0、i 变 1），赋值再把 0 写回","未指定——两种结果都可能","未定义行为"],ci:1,
   why:"赋值的右侧完整求值在左侧写入之前：i++ 交旧值 0 并把 i 增到 1，随后赋值写入 0。结果是确定的 0——第一档。你实跑过的话输出就是 0；GCC 仍会给保守警告，但那不是 UB 的证据。"},
  {k:"scene",

  {k:"predict",
   q:"order.cpp 的输出是什么？",

{ id:"IN", title:"初始化的规矩:列表、声明顺序与 explicit", kp:"kp_init",
  goal:"区分初始化与赋值;给一段初始化列表按声明顺序排出执行次序;说出 explicit 管什么。",

  steps:[
  {k:"board",stage:"intro",cap:"接上节课 · 生下来了,再谈出生时的值",

   d:"第二课讲出生那一刻。构造函数看起来都一样,其实有两个区域:冒号后面是初始化列表——成员在那里诞生;花括号里是函数体——对象已经出生,那里做的都是赋值。对普通 int 这区别看不出伤害,对 const 成员和引用成员是生死之别。第二条规矩更阴:列表的【书写】顺序不算数,执行按【声明】顺序——GCC 为此专门有警告。",
   help:"做题先分两步:谁在初始化(列表)、谁在赋值(函数体)?再数声明顺序。书写顺序从来不是执行顺序。"},

   d:"const 成员和引用成员必须在初始化列表里拿到值——函数体里赋值,编译器直接拒绝:const 不能被赋值,引用不能重绑。这是列表与赋值区别的硬证据。类内写 int x = 4 是 C++11 的默认成员初始化,构造函数没接住就用它。explicit 只管一件事:挡住单参构造函数参与的隐式转换——f(3) 传不了,必须 f(E(3)) 明写。它不管拷贝、不管多参。",
   help:"自查:成员有 const 或引用吗?有——列表里找它的出生地。构造函数参数想隐式转换吗?不想——加 explicit 把路堵死。"},
  {k:"board",stage:"example",cap:"示范 · init_all 与 init_trap 对照",
   lines:["成员声明顺序:a → c → b","","init_all.cpp 列表书写: c(y), B(x), a(x), b(a+c)","  执行: B1 → a=1 → c=2 → b=3","  输出 B1 |body: a=1 b=3 c=2  ✓","  (书写乱序,-Wreorder 提醒,结果没错)","","init_trap.cpp 列表书写: c(y), B(x), b(a+c)","  b(a+c) 求值时 a 还【没出生】","  GCC:警告 + 这次给 0 → b=2","  标准不给任何保证——值不可依赖"],
   d:"对照着看。init_all 的列表书写顺序一团乱(c 在 B 前),但执行按声明顺序:基类最先,a、c、b 依声明次序——b 求值时 a、c 都已就绪,3 是对的。-Wreorder 警告报的就是书写与声明的不一致。init_trap 漏了 a:b(a+c) 在 a 出生前求值——读未初始化成员,GCC 这次给 0,标准什么都不保证。题库里那道 Derived 题考的就是这个顺序,答案全在声明顺序里。",
   help:"数声明顺序的动作:先抄成员声明行(含基类),再给列表里的每项标次序。书写顺序涂掉,只看声明。"},

{ id:"CP", title:"拷贝控制:默认拷贝与三之法则", kp:"kp_copy",
  goal:"对一段类代码判定要不要写三件套;说出空类默认生成的六个成员。",
  found:"编译器生成的拷贝是逐成员拷贝——指针原样复制,两个对象同址,析构两次 delete 同一块。类在管资源(析构里有 delete)就要写三件套,要独占就 =delete。空类默认生成六个:构造/析构/拷贝构造/拷贝赋值/移动构造/移动赋值。",
  steps:[
  {k:"board",stage:"intro",cap:"接上节课 · 出生之后的第二份",
   lines:["第 3 讲 / 拷贝控制","","对象会生,也会被【复制】","","编译器悄悄生成的拷贝","抄的是什么?——逐成员,照抄","","Str b = a;   buf 原样复制","两个对象,同一个缓冲区","","判定工具:三之法则"],
   d:"第三课讲复制。编译器默认生成的拷贝构造和拷贝赋值做的是逐成员拷贝——对 int 正确,对指针就是灾难:两个对象拿到同一个地址,析构时 delete[] 同一块两次。shallow.cpp 实跑打印 same=1,然后被 glibc 当场击毙。三之法则给你一个判定词:这个类在管资源吗?",
   help:"默认拷贝不是敌人——对没有资源的类它恰好正确。要警惕的是『析构里有 delete 的类还在用默认拷贝』。"},
  {k:"board",cap:"概念 · 逐成员拷贝与三之法则",
   lines:["编译器生成的拷贝:逐成员照抄","  int   → 抄值   ✓","  char* → 抄地址 ✗(同址!)","","三之法则:写了下面任何一件,","就想想另外两件:","  ① 析构函数(管资源)","  ② 拷贝构造","  ③ 拷贝赋值","","空类默认生成【六个】:","  构造 / 析构 / 拷贝构造 / 拷贝赋值","  / 移动构造 / 移动赋值","","要独占 → =delete 拷贝两件"],
   d:"逐成员拷贝是默认行为,不是 bug——错的是在管资源的类上放任它。三之法则的判定词:析构里有没有 delete?有,拷贝就必须深拷贝(写拷贝构造 + 拷贝赋值);要独占语义就 =delete 掉拷贝两件——unique_ptr 就是这么做的。另外记一个常考清单:空类默认生成六个成员函数,构造、析构、拷贝构造、拷贝赋值、移动构造、移动赋值——不是两个。",
   help:"判定三问:析构管资源吗?拷贝要深还是禁?赋值要处理自赋值吗?三问齐了,这段类代码怎么改就定了。"},
  {k:"board",stage:"example",cap:"示范 · shallow 与 deep 对照",
   lines:["shallow.cpp(没写拷贝构造)","  Str b = a → buf 原样复制","  printf same=1 → 两个 buf 同一个地址","  程序结束时两次 delete[] 同一块","  glibc:double free detected → 崩溃","  (exit 134,glibc 的检测,非语言保证)","","deep.cpp(补齐拷贝构造 + 拷贝赋值)","  拷贝构造:自己 new 一块,内容照抄","  operator=:先 delete 旧的,再深拷","  还挡了自赋值 if (this != &o)","  same=0 → 干净结束"],
   d:"两份代码对照看。shallow 的默认拷贝把 buf 原样抄过去——打印 same=1 就是同址的现场证据,结尾两次释放同一块,glibc 报 double free 直接崩。deep 补齐三件套:拷贝构造自己 new 一块再抄内容;拷贝赋值先放掉旧缓冲、再深拷,还挡了自赋值。same=0,干净。注意:崩溃是 glibc 的检测行为,标准只说这是未定义行为——工具能抓,语义要自己懂。",
   help:"same=1 与 same=0 的差别就是『同址』与『各有一块』。等下你亲手判定三段类代码该走哪条路。"},

  {k:"scene",

{ id:"MK", title:"现代替代与规范:能不用宏就不用", kp:"kp_modern",
  goal:"给一段宏写法挑出规范问题并给出现代替代;说出宏名、消参、constexpr 三条规范要求。",
  found:"保护宏名 VOS_H 合规,_VOS_H、__VOS_H__ 都不行——下划线开头留给实现。消参宏用 (void)a 或 [[maybe_unused]]。constexpr 有类型、有作用域、可调试,规范推 constexpr;宏不理睬作用域,#define 写在函数里照样泄漏。__LINE__/__func__ 是标准预定义宏。",
  steps:[
  {k:"board",stage:"intro",cap:"接上节课 · 工程的规范面",
   lines:["第 4 讲 / 现代替代与规范","","前三课:宏怎么工作","本节课:规范让你少用宏","","三条规范线:","① 宏名:下划线开头留给实现","② 消参:(void)a / [[maybe_unused]]","③ 常量:constexpr 优先","","宏不理睬作用域——危险"],
   d:"第四章收尾课,从『怎么用』转到『为什么少用』。规范对宏的态度很明确:能用语言设施就别用文本替换。三条线:保护宏名字——下划线开头是 C++ 实现的保留地;消参——(void)a 或 [[maybe_unused]],别再写晦涩的消参宏;常量——constexpr 有类型、有作用域、可调试,宏三样全无。最后一条最反直觉:宏不理睬作用域,#define 写在函数体里,函数外照样能用。",
   help:"这课的题都是判断题级别:哪个宏名合规、哪种消参现代、为什么 constexpr 更好——把规则背成肌肉记忆。"},
  {k:"board",cap:"概念 · 三条规范线",
   lines:["① 宏名","   #define VOS_H      ✓ 常规大写","   #define _VOS_H     ✗ 下划线开头留给实现","   #define __VOS_H__  ✗ 双下划线更不行","","#define VOS_H 后再写 int VOS_H; → 名字撞车","   (宏不认作用域、不认类型)","","#define SIZE2 10  vs  constexpr int SIZE = 10","   宏:无类型 · 无作用域 · 调试器看不见","   constexpr:全有 + 能参与编译期检查","","#define LEAK 7  写在函数里 → 全文件剩余部分可用"],
   d:"三条线逐条过。宏名:VOS_H 是合规写法;_VOS_H 和 __VOS_H__ 触到实现保留字——这些名字是编译器和标准库的地盘,普通代码占用它可能悄悄冲突。消参:老代码 UNREFERNCE_PARAM(a) (a)=(a) 这类宏,现代写法是 (void)a 或 C++17 的 [[maybe_unused]]——语义明确、工具认得。constexpr 对 #define 的三大优势:有类型(int)、有作用域(花括号认)、调试器看得见;宏三样全没有。最后一格:宏不理睬作用域——modern.cpp 实跑,f() 里定义的 LEAK 在 main 里照样打出 7。",
   help:"记法:宏是给【预处理器】看的,预处理器不认识花括号——所以作用域拦不住它;# 只要求行首。"},

function bgmTick(){
  if(!SAVE.musicOn){stopBgm();return}
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume().catch(()=>{});
    const f=BGM_NOTES[BGM_POS++%BGM_NOTES.length];
    if(f){const osc=AC.createOscillator(),gain=AC.createGain();
      osc.type="triangle";osc.frequency.value=f;
      gain.gain.setValueAtTime(.012,AC.currentTime);
      gain.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.23);
      osc.connect(gain);gain.connect(AC.destination);
      osc.start();osc.stop(AC.currentTime+.23)}
  }catch(e){stopBgm()}
}

const KW=/\b(int|void|bool|char|double|float|long|short|unsigned|const|static|extern|inline|constexpr|class|struct|template|typename|namespace|using|new|delete|return|virtual|override|public|private|protected|mutable|if|else|while|for|do|switch|case|break|continue|auto|true|false|nullptr|this|operator|include|ifndef|define|endif)\b/g;

function typeInto(el,text,speed,done){
  if(el._typeTimer)clearTimeout(el._typeTimer);
  const token={};el._typeToken=token;
  const finish=()=>{if(el._typeToken!==token)return;clearTimeout(el._typeTimer);el._typeTimer=null;el._finishTyping=null;el.innerHTML=hl(text);if(done)done()};
  el._finishTyping=finish;
  if(RM||!speed){finish();return}
  let i=0;el.textContent="";
  const step=()=>{if(el._typeToken!==token)return;i=Math.min(text.length,i+2);el.textContent=text.slice(0,i);if(i<text.length)el._typeTimer=setTimeout(step,speed);else finish()};
  step();
}

function nextChapterIdx(){for(let i=0;i<LEVELS.length;i++)if(!SAVE.done[LEVELS[i].id])return i;return -1}
const CH_LESSONS=[CH1_LESSONS,CH2_LESSONS];
CH_LESSONS[2]=CH3_LESSONS;
CH_LESSONS[3]=CH4_LESSONS;
CH_LESSONS[4]=CH5_LESSONS;
CH_LESSONS[5]=CH6_LESSONS;
CH_LESSONS[6]=CH7_LESSONS; CH_LESSONS[7]=CH8_LESSONS; CH_LESSONS[8]=CH9_LESSONS; CH_LESSONS[9]=CH10_LESSONS; CH_LESSONS[10]=CH11_LESSONS; CH_LESSONS[11]=CH12_LESSONS; CH_LESSONS[12]=CH13_LESSONS;   /* 十三章全部注册完毕 */
function lessonKey(ci){return ci===0?"ch1":"ch"+(ci+1)}
function findLessonById(id,chapter,check){
  const hits=[];
  CH_LESSONS.forEach((group,ci)=>{if(chapter!==undefined&&chapter!==ci)return;group.forEach((lesson,ix)=>{if(lesson.id===id)hits.push({ci,ix})})});
  if(hits.length===1)return hits[0];
  // Older notes have no chapter; their knowledge-point check can disambiguate.
  return hits.find(hit=>check&&check.includes(KP_CHECK[CH_LESSONS[hit.ci][hit.ix].kp]))||null;
}
function chReady(i){
  if(SAVE.done[LEVELS[i].id]||SAVE["ready"+LEVELS[i].id])return true;
  const g=CH_LESSONS[i];if(g){const st=SAVE[lessonKey(i)]||{};return g.every(l=>(st[l.id]||{}).done)}return false;
}

/* ---- 互动章节：课时课堂（步骤机） ---- */
let CUR=null;
function openLesson(ci,ix){
  if(ix===undefined){ix=ci;ci=0}
  const lesson=CH_LESSONS[ci][ix],record=(SAVE[lessonKey(ci)]||{})[lesson.id]||{};
  const step=!record.done&&Number.isInteger(record.step)&&record.step>=0&&record.step<lesson.steps.length?record.step:0;
  CUR={chapter:ci,lesson,ix,step,learnStep:step,review:!!record.done,vWrong:false,assisted:Object.assign({},record.assisted)};
  showScreen("scr-class");renderStep();
}
function rememberLessonPosition(){
  if(CUR.review)return;
  const key=lessonKey(CUR.chapter);SAVE[key]=SAVE[key]||{};
  SAVE[key][CUR.lesson.id]=Object.assign(SAVE[key][CUR.lesson.id]||{},{step:CUR.step,assisted:CUR.assisted});
  CUR.learnStep=CUR.step;save();
}
function markLessonAssisted(){
  CUR.assisted[CUR.step]=true;CUR.vWrong=true;
  const record=(SAVE[lessonKey(CUR.chapter)]||{})[CUR.lesson.id];
  if(record){record.assisted=CUR.assisted;save()}
}
function browseLessonStep(step){
  if(!Number.isInteger(step)||step<0||step>=CUR.lesson.steps.length||step===CUR.step)return;
  if(CUR.lesson.steps[CUR.step]&&["variant","repair"].includes(CUR.lesson.steps[CUR.step].k))markLessonAssisted();
  if(!CUR.review)CUR.learnStep=CUR.step;
  CUR.review=true;CUR.step=step;sfx("page");renderStep();
}
function resumeLesson(){
  if(((SAVE[lessonKey(CUR.chapter)]||{})[CUR.lesson.id]||{}).done){renderLessonHub(CUR.chapter);return}
  CUR.review=false;CUR.step=CUR.learnStep;renderStep();
}
function stepStage(st){return st.stage||({board:"teach",scene:"example",op:"example",predict:"practice",probe:"practice",variant:"independent"})[st.k]}
const STAGE_LABELS={intro:"课程导入",teach:"概念讲解",example:"示例演示",practice:"随堂练习",recap:"课堂回顾",independent:"独立练习"};
const PRACTICE_TASKS={"C01":{"name":"修复头文件重复定义","q":"counter.h 同时被 main.cpp 与 worker.cpp 包含。请将原本重复的变量定义改为头文件中的 extern 声明和 counter.cpp 中的唯一定义，按这两个顺序填写。","before":"// counter.h（第一行）\n// counter.cpp（第二行）\n","starter":"int counter=0;\nint counter=0;","after":"\n// 头文件只放声明；源文件仅定义一次","solution":"extern int counter;\nint counter=0;","tip":"头文件 extern int counter;，源文件 int counter = 0;。","explain":"不同翻译单元都可看到同一声明，链接时只有 counter.cpp 的一份定义。"},"C02":{"name":"转换时机","q":"让 9 / 2 得到 4.5，而不是 4。你必须在除法之前做类型转换。","before":"int a=9,b=2;\ndouble result =","starter":"static_cast<double>(a / b)","after":";\nstd::cout<<result; // 4.5","solution":"static_cast<double>(a) / b","tip":"转换整个整数除法结果已经太晚；只转换 a 或 b。","explain":"先转换一个操作数，再执行浮点除法。"},"C03":{"name":"自增求值顺序","q":"消除 i++ + i++ 的未定义行为；按顺序保存两次旧值，再算 sum。","before":"int i=1;\n// 原写法：int sum=i++ + i++;\n","starter":"int sum=i++ + i++;","after":"\nstd::cout<<sum<<' '<<i; // 3 3","solution":"int left=i++;\nint right=i++;\nint sum=left+right;","tip":"先保存两次递增之前的值，再计算 sum。","explain":"把修改拆成顺序明确的语句，left=1、right=2、i=3。"},"C04":{"name":"悬垂引用","q":"返回局部对象的引用会悬垂。保持返回引用接口，修复生命周期。","before":"const int& getValue(){\n","starter":"const int value=42;\nreturn value;","after":"\n}\nint main(){std::cout<<getValue();}","solution":"static const int value=42;\nreturn value;","tip":"自动局部变量会销毁；static 局部对象活得更久。","explain":"static 局部对象在函数返回之后仍存在，引用有效。"},"C05":{"name":"函数替换宏","q":"宏 SQ(n++) 会重复修改 n。改写成内联函数 sq，让实参只求值一次。","before":"// 原宏 #define SQ(x) ((x)*(x))\n","starter":"#define sq(x) ((x)*(x))","after":"\nint main(){int n=2;int y=sq(n++);std::cout<<y<<' '<<n;}","solution":"inline int sq(int x){return x*x;}","tip":"形参只接收一次实参值，函数体使用 x。","explain":"函数只求值一次 n++，因此 y=4，n=3。"},"C06":{"name":"静态成员定义","q":"Counter 已声明 static int total。请在类外提供唯一定义。","before":"struct Counter{static int total;Counter(){++total;}};\n","starter":"static int Counter::total=0;","after":"\nint main(){Counter a,b;std::cout<<Counter::total;}","solution":"int Counter::total=0;","tip":"类外定义不重复写 static。","explain":"所有 Counter 对象使用同一个静态数据成员。"},"C07":{"name":"避免切片","q":"show 按值接收 Base 导致切片。改成保持动态绑定的参数形式。","before":"struct Base{virtual const char* name()const{return \"Base\";}};\nstruct Derived:Base{const char* name()const override{return \"Derived\";}};\n","starter":"void show(Base b)","after":"{std::cout<<b.name();}\nint main(){Derived d;show(d);} // Derived","solution":"void show(const Base& b)","tip":"传入 const Base&，不要拷贝基类子对象。","explain":"引用原来的 Derived 对象，虚调用可以到派生版本。"},"C08":{"name":"类模板偏特化","q":"编写 Box<T,T> 的偏特化，让相同类型组合的 tag=1。","before":"template<class T,class U>struct Box{static constexpr int tag=0;};\n","starter":"template<class T>struct Box<T>{static constexpr int tag=1;};","after":"\nstatic_assert(Box<int,int>::tag==1);\nstatic_assert(Box<int,double>::tag==0);","solution":"template<class T>struct Box<T,T>{static constexpr int tag=1;};","tip":"偏特化形状需写两个参数位置：Box<T,T>。","explain":"只有两个类型相同的组合命中偏特化。"},"C09":{"name":"迭代器失效","q":"删除 vector 中所有的 2：删除时接住 erase 的返回值，否则才 ++it。","before":"std::vector<int> v{2,3,2,4};\n","starter":"for(auto it=v.begin();it!=v.end();++it){if(*it==2)v.erase(it);}","after":"\n// 期待剩余 3、4；连续出现的 2 也要删掉","solution":"for(auto it=v.begin();it!=v.end();){if(*it==2)it=v.erase(it);else ++it;}","tip":"erase 会让旧迭代器失效。删除分支必须接住返回值。","explain":"只有未删除时才递增，避免使用失效迭代器。"},"C10":{"name":"lambda 生命周期","q":"返回引用捕获局部 n 的 lambda 会悬垂。改成安全的可修改闭包。","before":"std::function<int()> make(){int n=0;\n","starter":"return [&n]{return ++n;};","after":"\n}\n// f() 连续调用得到 1、2","solution":"return [n]() mutable {return ++n;};","tip":"捕获 n 的副本，并用 mutable 修改闭包中的副本。","explain":"闭包自带 n，函数返回后仍可安全使用。"},"C11":{"name":"异常对象切片","q":"按值捕获 std::exception 可能切片。改为规范的引用捕获。","before":"try{risky();}\n","starter":"catch(std::exception e)","after":"{std::cout<<e.what();}","solution":"catch(const std::exception& e)","tip":"常用 const T& 捕获异常。","explain":"避免基类对象拷贝及切片，保留多态。"},"C12":{"name":"async 执行策略","q":"显式选择 std::launch::async，避免默认策略可能 deferred。","before":"auto job=[]{return 42;};\nauto fut=","starter":"std::async(job)","after":";\nstd::cout<<fut.get();","solution":"std::async(std::launch::async,job)","tip":"在第一个参数写 std::launch::async。","explain":"明确指定异步启动策略，不依赖实现选择。"},"C13":{"name":"构建和调试","q":"链接 main.cpp 和 calc.cpp，使用 C++17 与 -g，输出 app。","before":"$ ","starter":"g++ main.cpp -o app","after":"\n// calc.cpp 定义了 main.cpp 调用的函数","solution":"g++ -std=c++17 -g main.cpp calc.cpp -o app","tip":"两个源文件都要编译；加上 -g 与 -std=c++17。","explain":"一起链接两个源文件，并保留调试符号。"}};
function stepBoard(st){
  if(st.lines)return st.lines.join("\n");
  if(st.q){
    let context=st.code?st.code.join("\n"):"";
    if(st.k==="predict"&&!context){
      const scenes=CUR.lesson.steps.slice(0,CUR.step).filter(s=>s.k==="scene");
      const scene=scenes[scenes.length-1];
      if(scene)context=scene.files.map(f=>"// "+f.n+"\n"+f.code.join("\n")).join("\n\n");
    }
    return st.q+(context?"\n\n"+context:"");
  }
  if(st.files)return st.d+"\n\n"+st.files.map(f=>"// "+f.n+"\n"+f.code.join("\n")).join("\n\n");
  return OP_CONTENT[st.kind].before.join("\n");
}

function stepSpeak(text){
  const tx=$("#sp-tx"),hint=$("#sp-hint"),speech=$("#speech");if(!tx)return;
  if(hint){hint.hidden=false;hint.textContent="点击显示完整讲解"}
  const finish=()=>{if(tx._finishTyping)tx._finishTyping()};
  if(speech){speech.onclick=finish;speech.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();finish()}}}
  typeInto(tx,text,RM?0:12,()=>{if(hint){hint.hidden=false;hint.textContent="讲解完毕 · 可以继续"}});
}
function stepSpeakInstant(text){const tx=$("#sp-tx");if(tx)typeInto(tx,text,0);const h=$("#sp-hint");if(h){h.hidden=false;h.textContent="讲解完毕 · 可以继续"}}
function renderStep(){
  const ls=CUR.lesson,st=ls.steps[CUR.step];
  if(!st){finishLesson();return}
  rememberLessonPosition();
  CUR.phase=st.k;
  if(st.k==="scene"){
    lessonChrome('<div class="op-caption">完整代码已写在黑板上。先找出每个名字出现的位置，再进入分析。</div>',"一起分析 ▶","bt-next");
    stepSpeak(st.d);wireNext();
  }else if(st.k==="board"){
    lessonChrome("",st.next||"继续听讲 ▶","bt-next");
    if(!CUR.review)mUp(ls.kp,1);
    stepSpeak(st.d);
    wireNext();
  }else if(st.k==="predict"){
    lessonChrome('<div class="qnum">结合黑板上的案例，说说你的判断</div><div class="opts">'+st.opts.map((o,k)=>'<button data-k="'+k+'"><span class="ol">'+String.fromCharCode(65+k)+'</span><span>'+ESC(o.t)+"</span></button>").join("")+"</div>","");
    stepSpeak("我们已经看过概念和例子。现在请用刚才的方法做一个预测，选完后我们一起验证。");
    $$("#stepzone .opts button").forEach(b=>{b.onclick=()=>{
      const o=st.opts[+b.dataset.k];sfx("click");
      $$("#stepzone .opts button").forEach(x=>x.disabled=true);
      b.classList.add("reveal");
      if(o.mis&&!CUR.review)noteMiscon(o.mis,ls.found||"课堂马上验证你的怀疑。","下次检查:"+KP_CHECK[ls.kp],{chapter:CUR.chapter,lesson:ls.id});
      const rv=document.createElement("div");rv.className="review ok";
      rv.innerHTML='<div class="rl">教授 · 顺着你的怀疑走</div>'+ESC(o.react);
      $("#stepzone").appendChild(rv);
      setLessonBoard(stepBoard(st)+"\n\n你的预测："+o.t+"\n\n教授回应："+o.react);
      stepSpeakInstant(o.react);
      const nx=document.createElement("button");nx.className="btn";nx.style.marginTop="10px";nx.textContent="验证 ▶";
      nx.onclick=()=>{sfx("page");CUR.step++;renderStep()};
      $("#stepzone").appendChild(nx);
    }});
  }else if(st.k==="probe"){
    quizStep(st,false);
  }else if(st.k==="variant"){
    CUR.vWrong=!!CUR.assisted[CUR.step];
    quizStep(st,true);
  }else if(st.k==="repair"){
    renderRepairStep(st);
  }else if(st.k==="op"){
    lessonChrome("","");renderOp(st);
  }
}
function validateRepair(id,answer){
 const c=answer.replace(/\/\/[^\n]*$/gm,"").replace(/\s+/g,"");
 switch(id){
 case "C01":return /^externintcounter;intcounter=0;$/.test(c);
 case "C02":return /^static_cast<double>\(a\)\/b;?$/.test(c)||/^a\/static_cast<double>\(b\);?$/.test(c);
 case "C03":return /^intleft=i\+\+;intright=i\+\+;intsum=left\+right;$/.test(c);
 case "C04":return /^(staticconst|conststatic)intvalue=42;returnvalue;$/.test(c);
 case "C05":return /^(inline|constexpr)intsq\(intx\)\{returnx\*x;\};?$/.test(c);
 case "C06":return /^intCounter::total=0;$/.test(c);
 case "C07":return /^voidshow\((constBase|Baseconst)&b\)$/.test(c);
 case "C08":return /^template<(class|typename)T>structBox<T,T>\{staticconstexprinttag=1;\};$/.test(c);
 case "C09":return /for\(autoit=v\.begin\(\);it!=v\.end\(\);\)/.test(c)&&/if\(\*it==2\)/.test(c)&&/it=v\.erase\(it\);/.test(c)&&/else(\{)?\+\+it;/.test(c)&&!/for\([^)]*\+\+it/.test(c);
 case "C10":return /^return\[n\]\(\)mutable\{return\+\+n;\};$/.test(c);
 case "C11":return /^catch\((conststd::exception|std::exceptionconst)&e\)$/.test(c);
 case "C12":return /^std::async\(std::launch::async,job\);?$/.test(c);
 case "C13":return /^g\+\+/.test(answer.trim())&&/(?:^|\s)-g(?:\s|$)/.test(answer)&&/(?:^|\s)-std=c\+\+17(?:\s|$)/.test(answer)&&/\bmain\.cpp\b/.test(answer)&&/\bcalc\.cpp\b/.test(answer)&&/-o\s+app(?:\s|$)/.test(answer);
 default:return false;
 }
}

function renderRepairStep(st){
 const t=PRACTICE_TASKS[st.id],ls=CUR.lesson;
 lessonChrome('<div class="qnum">CODE CHALLENGE · 亲手修复</div><div class="qstem">'+ESC(t.q)+'</div>'+
 '<div class="repair-code"><pre>'+hl(t.before)+'</pre></div>'+
 '<textarea id="repair-input" class="repair-edit" spellcheck="false" aria-label="自己修复的 C++ 代码"></textarea>'+
 '<div class="repair-code"><pre>'+hl(t.after)+'</pre></div>'+
 '<div class="small dim">结构核验：浏览器不执行 C++ 编译；等价实现可在 g++ 中验证。</div>'+
 '<div id="repair-feedback" class="repair-feedback" aria-live="polite"></div>'+
 '<button class="btn" id="repair-check">验证修复 ▶</button> <button class="btn ghost small" id="repair-show" hidden>查看参考修复（引导完成）</button>',"");
 const input=$("#repair-input"),fb=$("#repair-feedback"),check=$("#repair-check"),show=$("#repair-show");
 input.value=t.starter;let failed=0;
 const explain=(ok,msg)=>{fb.innerHTML='<div class="review '+(ok?"ok":"ng")+'">'+ESC(msg)+'</div>';stepSpeakInstant(msg)};
 stepSpeakInstant("先亲自编辑程序，再检查关键结构。这里不伪装成 C++ 编译器。");
 check.onclick=()=>{
  const code=input.value;
  if(!validateRepair(st.id,code)){
   failed++;sfx("bad");
   if(!CUR.review&&failed===1){markLessonAssisted();noteMiscon("修复前："+t.starter.slice(0,60),"实际规则："+t.explain,"复习提示："+t.tip,{chapter:CUR.chapter,lesson:ls.id})}
   explain(false,(failed>1?t.tip:"关键结构仍不符合本题要求。检查每个修改所依据的规则。"));
   if(failed>=2)show.hidden=false;return;
  }
  sfx("good");check.disabled=true;show.hidden=true;input.readOnly=true;
  if(!CUR.review){
   SAVE.codeTasks=SAVE.codeTasks||{};
   if(!SAVE.codeTasks[st.id]){SAVE.codeTasks[st.id]={assisted:!!CUR.assisted[CUR.step],code};addXP(4)}
   mUp(ls.kp,CUR.assisted[CUR.step]?2:3);save();
  }
  setLessonBoard(t.before+"\n"+code+"\n"+t.after+"\n\n"+t.explain);
  explain(true,"结构核验通过！"+t.explain+" 如采用其他等价写法，请在本机用 g++ 验证。");
  const next=document.createElement("button");next.className="btn";next.textContent="继续 ▶";next.onclick=()=>{sfx("page");CUR.step++;renderStep()};fb.appendChild(next);
 };
 show.onclick=()=>{if(!CUR.review)markLessonAssisted();input.value=t.solution;show.hidden=true;explain(false,"参考实现已填入。请看懂后再点击验证。")};
}

function quizStep(st,isVariant){
  const ls=CUR.lesson;
  lessonChrome('<div class="qnum">'+(isVariant?"独立练习 · 可回看概念，使用提示会记录":"随堂练习 · 先判断，再看讲评")+'</div><div class="opts">'+st.opts.map((o,k)=>'<button data-k="'+k+'"><span class="ol">'+String.fromCharCode(65+k)+'</span><span>'+ESC(o)+"</span></button>").join("")+"</div>"+
    '<div id="reviewzone"></div>',"","bt-next");

function mUp(kp,lv){SAVE.mastery[kp]=Math.max(SAVE.mastery[kp]||0,lv);save()}
function finishLesson(){
  const ls=CUR.lesson,key=lessonKey(CUR.chapter);
  if(!CUR.review){
    SAVE[key]=SAVE[key]||{};
    const firstCompletion=!(SAVE[key][ls.id]||{}).done;
    SAVE[key][ls.id]=Object.assign(SAVE[key][ls.id]||{},{done:true});
    if(firstCompletion)addXP(8);sfx("win");save();
  }

function fileCards(files){
  return '<div class="fcards">'+files.map(f=>'<div class="fcard"><div class="fh">'+ESC(f.n)+'</div><pre style="margin:0;font-family:inherit">'+hl(f.code.join("\n"))+'</pre></div>').join("")+'</div>';
}
function renderOp(st){
  const zone=$("#stepzone"),op=OP_CONTENT[st.kind];let stage=0;
  zone.innerHTML='<div class="op-caption">分步教学演示 · 每次点击观察一个变化</div><button class="btn" id="bt-op">'+op.labels[0]+'</button><div id="opview"></div>';
  stepSpeak(st.d);
  const enableNext=()=>{
    if($("#bt-op-next"))return;
    const nx=document.createElement("button");nx.className="btn";nx.id="bt-op-next";nx.style.marginTop="12px";nx.textContent="看下一步讲解 ▶";
    nx.onclick=()=>{sfx("page");CUR.step++;renderStep()};
    $("#opview").appendChild(nx);
  };
  $("#bt-op").onclick=()=>{
    sfx("page");stage++;
    if(st.kind==="fix"){
      $("#bt-op").disabled=true;
      drawOpView("fix",undefined,(o)=>{
        if(o.ok){setLessonBoard(op.boards[0].join("\n"));enableNext()}
        else setLessonBoard(op.before.join("\n")+"\n\n你选择的方案："+o.t+"\n\n教授讲解："+o.r);
      });
      stepSpeakInstant("先选一张修复卡。我们会检查它是否真的让共享变量只剩一份定义。");
      return;
    }
    if(st.kind==="tracefill"||st.kind==="pathpick"||st.kind==="eventorder"||st.kind==="strtable"||st.kind==="ptrtrace"||st.kind==="objtime"||st.kind==="copyjudge"||st.kind==="initchain"||st.kind==="expandtab"||st.kind==="sidefx"||st.kind==="cpppath"||st.kind==="insttab"||st.kind==="locpick"||st.kind==="deducetab"||st.kind==="spectab"||st.kind==="vctab"||st.kind==="oxtab"||st.kind==="invaltab"||st.kind==="sorttab"||st.kind==="cptab"||st.kind==="sctab"||st.kind==="dgtab"||st.kind==="cwtab"||st.kind==="ratab"||st.kind==="cstab"||st.kind==="mvtab"||st.kind==="extab"||st.kind==="thtab"||st.kind==="attab"||st.kind==="lktab"||st.kind==="aytab"||st.kind==="gdbtab"||st.kind==="gatab"||st.kind==="tstab"||st.kind==="cbtab"){
      $("#bt-op").disabled=true;
      drawOpView(st.kind,undefined,(o)=>{if(o.ok){setLessonBoard(op.done);enableNext()}});
      stepSpeakInstant("动手环节：点对的会亮绿锁定，点错的当场讲评。全部点亮才能进入下一步。");
      return;
    }
    drawOpView(st.kind,stage);
    setLessonBoard(op.boards[stage-1].join("\n"));
    stepSpeakInstant(op.speech?op.speech[stage-1]:st.react);
    if(stage<op.labels.length)$("#bt-op").textContent=op.labels[stage];
    else{$("#bt-op").disabled=true;enableNext()}
  };
}

/* ---- 卡片点选表的公共机构:同一份标记 + 同一套点亮规则 ----
   点对的格亮绿锁定,整行齐了讲评一行;全表点亮才算过关。 */
function chipTableHTML(tabId,capId,title,capPre,rows,cols,choices,stmtW){
  const chip='style="font-family:var(--f-mono);font-size:12px;padding:2px 7px;margin:2px 3px;background:none;border:1px solid var(--line);color:var(--fg);cursor:pointer"';
  return '<div class="symtab" id="'+tabId+'"><div class="sh">'+title+'</div>'+
   rows.map((r,ri)=>'<div class="sr"><span style="width:'+stmtW+'px;font-family:var(--f-mono)">'+ESC(r.s)+'</span>'+
    cols.map(cv=>'<span class="tfgrp" data-r="'+ri+'" data-v="'+cv+'">('+ESC(cv)+') '+choices[cv].map(val=>'<button class="chipopt" '+chip+' data-r="'+ri+'" data-v="'+cv+'" data-val="'+val+'">'+ESC(val)+'</button>').join("")+'</span>').join("")+
   '</div>').join("")+'</div><div class="op-caption" id="'+capId+'">'+capPre+' · 已定 0 / '+(rows.length*cols.length)+'</div>';
}
function wireChipTable(tabId,capId,capPre,op,cols,onDone){
  const rows=op.rows;let filled=0;const total=rows.length*cols.length;
  const speak=m=>stepSpeakInstant(m);
  $$("#"+tabId+" .chipopt").forEach(b=>{b.onclick=()=>{
    const ri=+b.dataset.r,cv=b.dataset.v,r=rows[ri],grp=b.parentElement;
    if(grp.dataset.ok)return;
    const val=b.dataset.val;
    if(val===r.ok[cv]){
      sfx("good");grp.dataset.ok="1";grp.innerHTML='<b style="color:var(--green)">'+ESC(cv)+'='+ESC(val)+'</b>';
      filled++;$("#"+capId).textContent=capPre+" · 已定 "+filled+" / "+total;
      const rowDone=cols.every(x=>document.querySelector('#'+tabId+' .tfgrp[data-r="'+ri+'"][data-v="'+x+'"]').dataset.ok);
      if(rowDone)speak(r.pr);
      if(filled===total){$("#"+capId).textContent=op.done;speak(op.done);if(onDone)onDone({ok:true})}
    }else{
      sfx("bad");b.style.borderColor="var(--red)";
      speak(r.mis[cv+"="+val]||r.def);
    }
  }});
}

   '<div class="disp" style="font-size:10px;color:var(--cyan);letter-spacing:2px;margin:0 0 14px">EXAM · 第 '+(EX.i+1)+" 章考核 — "+lv.name+"</div>"+
   '<div class="panel" style="padding:12px 16px;font-size:14px">独立作答,<b>交卷前没有评讲</b>。对 4/5 通过。<button class="btn ghost small" id="bt-exam-out" style="float:right">退出</button></div>'+
   '<div class="examq"><div class="qnum">第 '+(EX.cur+1)+" / "+EX.qs.length+' 题 <span class="tag gold">'+it.lab+"</span></div>"+
   '<div class="qstem">'+ESC(q.q)+"</div>"+(q.code?'<div class="codebox"><pre>'+hl(q.code.join("\n"))+"</pre></div>":"")+
   '<div class="opts">'+q.opts.map((o,k)=>'<button data-k="'+k+'"'+(EX.ans[EX.cur]===k?' style="border-color:var(--gold)"':"")+'><span class="ol">'+String.fromCharCode(65+k)+'</span><span>'+ESC(o)+"</span></button>").join("")+"</div></div>"+
   '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><button class="btn ghost" id="bt-prev" '+(EX.cur===0?"disabled":"")+">上一题</button>"+
   '<button class="btn" id="bt-nextq">'+(EX.cur===EX.qs.length-1?"交卷 ✓":"下一题 ▶")+"</button></div>";
  $("#bt-exam-out").onclick=()=>{sfx("click");EX=null;renderCampus();showScreen("scr-campus")};
  $$("#scr-exam .opts button").forEach(b=>{b.onclick=()=>{EX.ans[EX.cur]=+b.dataset.k;sfx("click");renderExamQ()}});
  $("#bt-prev").onclick=()=>{sfx("click");EX.cur--;renderExamQ()};
  $("#bt-nextq").onclick=()=>{sfx("click");if(EX.ans[EX.cur]<0){sfx("bad");return}if(EX.cur<EX.qs.length-1){EX.cur++;renderExamQ()}else submitExam()};
}
function submitExam(){
  const lv=LEVELS[EX.i];
  let ok=0;EX.ans.forEach((a,j)=>{if(a===EX.qs[j].q.ci)ok++});
  const wrongs=EX.qs.map((it,j)=>({it:it,a:EX.ans[j]})).filter(x=>x.a!==x.it.q.ci);
  const pass=ok>=4,stars=Math.max(1,3-(EX.qs.length-ok));
  if(pass&&!SAVE.done[lv.id]){SAVE.done[lv.id]=stars;addXP(20)}
  save();sfx(pass?"win":"bad");
  $("#scr-exam").innerHTML=
   '<div class="disp" style="font-size:10px;color:var(--cyan);letter-spacing:2px;margin:0 0 14px">EXAM RESULT · 考核结果</div>'+
   "<h2>"+(pass?"通过!":"差一点。")+"</h2>"+
   '<div class="examres">'+EX.qs.map((it,j)=>'<span class="rq '+(EX.ans[j]===it.q.ci?"ok":"ng")+'">'+it.lab+" "+(EX.ans[j]===it.q.ci?"✓":"✗")+"</span>").join("")+"</div>"+
   '<div class="panel" style="text-align:left"><b>'+ok+" / "+EX.qs.length+"</b>"+(pass?" —— 本章考核通过"+(SAVE.done[lv.id]?"("+("★".repeat(SAVE.done[lv.id]))+")":"")+",下一章已开放。":",及格线是对 4。下面是补习清单——教授办公室有对应的误区档案。")+
   (wrongs.length?'<div style="margin-top:10px"><b>补习清单:</b></div>'+wrongs.map(x=>'<div class="note"><div class="n1">✗ '+ESC(x.it.q.q.slice(0,40))+"…</div><div class=\"n2\">正确思路:"+ESC(x.it.q.why.split("。")[0])+"。</div></div>").join(""):"")+
   "</div>"+
   '<div style="display:flex;gap:10px;flex-wrap:wrap">'+(pass?'<button class="btn" id="bt-r-campus">回校园</button>':'<button class="btn" id="bt-r-retake">重考</button><button class="btn ghost" id="bt-r-office">去办公室</button><button class="btn ghost small" id="bt-r-campus">回校园</button>')+"</div>"+
   (pass&&passedCount()>=LEVELS.length?"<div class='small dim' style='margin-top:12px'>十三门全部通过——大礼堂已经为你开门,去毕业吧。</div>":"");
  const back=()=>{sfx("click");EX=null;renderCampus();showScreen("scr-campus")};
  $("#bt-r-campus").onclick=back;
  if(!pass){
    $("#bt-r-retake").onclick=()=>{sfx("click");startExam(EX.i)};
    $("#bt-r-office").onclick=()=>{sfx("click");EX=null;renderOffice();showScreen("scr-office")};
  }
}
/* ---- 办公室:误区档案 ---- */
function renderOffice(){
  showScreen("scr-office");
  const ms=SAVE.miscon;
  $("#scr-office").innerHTML=
   '<div class="disp" style="font-size:10px;color:var(--cyan);letter-spacing:2px;margin:0 0 14px">OFFICE HOURS · 教授办公室</div>'+
   '<div class="panel" style="padding:12px 16px;font-size:14px">'+(ms.length?"教授翻出你的误区档案,一条一条补。<b>补好一条,归档一条。</b>":"档案还是空的。课堂里答错的题会自动记进来——带着它来,教授从你的误区开始讲。")+
   '<button class="btn ghost small" id="bt-off-back" style="float:right">校园</button></div>'+
   (ms.length?ms.map((m,ix)=>{
     const act=m.src?(m.src.lesson?"重访课时":"回炉课堂"):"";
     return '<div class="note"><div class="n1">'+ESC(m.think)+'</div><div class="n2">'+ESC(m.found)+'</div><div class="n3">'+ESC(m.check)+"</div>"+
      '<div class="nact">'+(act?'<button class="btn ghost small" data-act="'+ix+'">'+act+" ▶</button> ":"")+
      '<button class="btn small" data-fix="'+ix+'">已补好 · 归档</button></div></div>';
   }).join(""):"");
  $("#bt-off-back").onclick=()=>{sfx("click");renderCampus();showScreen("scr-campus")};
  $$("#scr-office [data-act]").forEach(b=>{b.onclick=()=>{
    const m=SAVE.miscon[+b.dataset.act];sfx("click");
    if(m.src&&m.src.lesson){const hit=findLessonById(m.src.lesson,m.src.chapter,m.check);if(hit)openLesson(hit.ci,hit.ix);else renderChapters();return}
    const i=LEVELS.findIndex(l=>l.id===(m.src&&m.src.lv));openLegacy(i>=0?i:0);
  }});
  $$("#scr-office [data-fix]").forEach(b=>{b.onclick=()=>{sfx("good");SAVE.miscon.splice(+b.dataset.fix,1);save();renderOffice()}});
}
/* ---- 图书馆:笔记本 + 掌握度 ---- */
function renderLibrary(){
  showScreen("scr-library");
  const ms=SAVE.miscon;
  $("#scr-library").innerHTML=
   '<div class="disp" style="font-size:10px;color:var(--cyan);letter-spacing:2px;margin:0 0 14px">LIBRARY · 图书馆</div>'+
   '<div class="panel" style="padding:12px 16px;font-size:14px">你的误区笔记本(自动生成)+ 掌握度一览。<button class="btn ghost small" id="bt-lib-back" style="float:right">校园</button></div>'+
   '<div class="panel"><div style="font-weight:900;margin-bottom:8px">掌握度一览(互动课时)</div>'+CH_LESSONS.map((g,ci)=>'<div style="margin-bottom:10px"><div class="small dim" style="margin-bottom:4px">第 '+(ci+1)+' 章</div><div class="mrow">'+g.map(ls=>{
     const m=SAVE.mastery[ls.kp]||0;
     return '<span class="mchip'+(m?" s"+m:"")+'">'+KPS[ls.kp]+" · "+["未接触","接触过","引导下完成","独立答题"][m]+"</span>";
   }).join("")+"</div></div>").join("")+
   '<div class="panel"><div style="font-weight:900;margin-bottom:8px">误区笔记本 ('+ms.length+' 条)</div>'+
   (ms.length?ms.map(m=>'<div class="note"><div class="n1">'+ESC(m.think)+'</div><div class="n2">'+ESC(m.found)+'</div><div class="n3">'+ESC(m.check)+"</div></div>").join(""):'<div class="small dim">空笔记本是最好的笔记本——但答错而记下的,比全对而空着的更有用。</div>')+"</div>";
  $("#bt-lib-back").onclick=()=>{sfx("click");renderCampus();showScreen("scr-campus")};
}
/* ---- 大礼堂:毕业典礼 ---- */
function renderCeremony(){
  showScreen("scr-ceremony");
  const misN=SAVE.miscon.length;
  const allKps=[];CH_LESSONS.forEach(g=>g.forEach(ls=>{if(allKps.indexOf(ls.kp)<0)allKps.push(ls.kp)}));
  const indep=allKps.filter(k=>(SAVE.mastery[k]||0)>=3).length,total=allKps.length;
  $("#scr-ceremony").innerHTML=
   '<div style="text-align:center;padding-top:16px"><div class="disp" style="font-size:10px;color:var(--gold);letter-spacing:2px">GRADUATION · 毕业典礼</div>'+
   "<h1 style='font-size:30px'>"+ESC(SAVE.name)+",毕业了</h1>"+
   '<div class="panel" style="max-width:560px;margin:14px auto;text-align:left">'+
   '<div>十三章挑战或考试已通过,XP '+SAVE.xp+"。</div>"+
   '<div style="margin-top:6px">一路上你的误区笔记本记下过 <b>'+misN+"</b> 条\"我原来以为\"——现在它们都是你的了。</div>"+
   '<div style="margin-top:6px">互动课时共 '+total+' 个知识点,你能<b>独立掌握</b>的有 '+indep+"/"+total+"。"+(indep<total?"没到独立的那几个,回去把变式重做一遍再走。":"全部独立掌握——这正是这门课要教你的:不是背答案,是能自己判断。")+"</div></div>"+
   '<div class="panel" style="max-width:560px;margin:0 auto;text-align:left"><div class="who" style="font-family:var(--f-disp);font-size:9px;color:var(--gold)">教授 · 最后一段话</div>'+
   '<div>"结业考试 60 题、对 42 及格——那是下一座山,去题库里实刷。'+(misN?"考前把你笔记本里的 "+misN+" 条误区再看一遍,那是最准的复习提纲。":"")+'教室随时开着。"</div></div>'+
   '<div style="margin-top:16px"><button class="btn" id="bt-cer-back">回校园</button></div></div>';
  $("#bt-cer-back").onclick=()=>{sfx("click");renderCampus();showScreen("scr-campus")};
}
/* ---- 启动 ---- */
$("#bt-sfx").onclick=()=>{SAVE.soundOff=!SAVE.soundOff;save();syncAudioButtons();if(!SAVE.soundOff)sfx("click")};
$("#bt-music").onclick=()=>{SAVE.musicOn=!SAVE.musicOn;save();syncAudioButtons();if(SAVE.musicOn)startBgm();else stopBgm()};
$("#bt-reset").onclick=function(){
  if(this.dataset.arm){SAVE={name:"学员",enrolled:false,place:0,xp:0,done:{},mastery:{},miscon:[],ch1:{},ch2:{},ch3:{},ch4:{},ch5:{},ch6:{},ch7:{},ch8:{},ch9:{},ch10:{},ch11:{},ch12:{},ch13:{}};save();renderTitle();showScreen("scr-title");this.textContent="重开";delete this.dataset.arm}
  else{this.dataset.arm="1";this.textContent="确认清档?";setTimeout(()=>{this.textContent="重开";delete this.dataset.arm},2500)}
};
SAVE.musicOn=false; // 背景音乐始终由玩家主动开启，不自动播放
renderTitle();updateStatus();syncAudioButtons();
</script>
